<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>盗版植物大战僵尸</title>
<link rel="stylesheet" href="../ui/yc-ui.css">
<style>
  #hud { justify-content: flex-end; gap: 10px; }
  #hud .chip b { color: #7ad0ff; }
  #hint { color: #d8f0c8; }
  #over.win .panel h1 { color: #b6ff9a; text-shadow: 0 0 18px rgba(120,255,120,.6); }
  #over.win .panel p { color: #cfe8c0; }
  #over.lose .panel h1 { color: #ffb0b0; text-shadow: 0 0 18px rgba(255,60,60,.6); }
  #over.lose .panel p { color: #f0c0c0; }

  /* 开局遮罩不能缺角（配合下面 resize() 的宽度计算，双保险）：
     · #stage 不许被 flex 压扁，圆角改由它来裁，画布圆角和遮罩圆角永远是同一个；
     · 遮罩铺得比画布大 2px、自己不再画圆角，多出来的边由 #stage 的 overflow:hidden 圆角裁掉，
       backdrop-filter 的模糊就不可能停在角上；顺手补上 iOS 需要的 -webkit- 前缀。 */
  #stage { flex: 0 0 auto; border-radius: 14px; }
  .overlay {
    inset: -2px;
    border-radius: 0;
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud">
      <div class="chip">Token <b id="sunCount">100</b></div>
      <div class="chip" id="clock">05:00</div>
    </div>

    <div id="banner"></div>
    <div id="hint">点卡片种植物 · 点 token 收集 · 铲子铲除</div>

    <div class="overlay" id="intro">
      <div class="panel">
        <h1>虫豸版PVZ</h1>
        <p>种向日葵攒 token，用豌豆 / 双发 / 青梅绿茶 / 坚果 / 睡蘑菇 / 地雷抵御僵尸，撑过 5 分钟就赢。<br>僵尸走到最左边红线就输。</p>
        <button class="btn" id="startBtn" type="button">开始防守</button>
      </div>
    </div>

    <div class="overlay hidden" id="over">
      <div class="panel">
        <h1 id="overTitle">游戏结束</h1>
        <p id="overStats"></p>
        <button class="btn" id="retryBtn" type="button">再来一局</button>
      </div>
    </div>
  </div>
</div>

<script src="../ui/yc-ui.js"></script>
<script>
(function () {
  'use strict';

  /* ================= 画布与坐标系 ================= */
  var W = 900, H = 560;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var st = document.getElementById('stage');
  var UNIT = 1;

  var GRID_X = 140, GRID_Y = 76;
  var COLS = 9, ROWS = 5;
  var CW = 80, CH = 96;
  var GRID_X2 = GRID_X + COLS * CW;
  var GRID_Y2 = GRID_Y + ROWS * CH;

  var GAME_TIME = 300;

  function resize() {
    /* 可用区域 = 视口减去 #wrap 的 10px 内边距（ui/yc-ui.css 里定的）。
       这里必须算得下得去，否则会出现「开局遮罩缺角」：
       以前是 (innerWidth - 24) 再 Math.max(0.4, s)，窄屏（手机竖屏，手机里再套一层站点外壳的
       iframe 时更窄）算出来的画布比可用宽度还宽 —— #stage 是 flex item 会被压扁，
       画布右侧溢出、被 overflow:hidden 以**方角**裁掉；而开局遮罩是圆角的，
       于是右上、右下两个角露出没糊住、也没压暗的画面。 */
    var availW = Math.max(160, window.innerWidth - 20);
    var availH = Math.max(160, window.innerHeight - 20);
    var s = Math.min(availW / W, availH / H);    /* 放得下的最大缩放，不再硬撑 0.4 下限 */
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W * s * dpr);
    cv.height = Math.round(H * s * dpr);
    cv.style.width = Math.min(availW, Math.round(W * s)) + 'px';
    cv.style.height = Math.min(availH, Math.round(H * s)) + 'px';
    st.style.width = cv.style.width;
    st.style.height = cv.style.height;
    UNIT = s * dpr;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();

  /* ================= 配置 ================= */
  var SEEDS = [
    { key: 'sunflower',     name: '向日葵',     cost: 50,  hp: 100, cd: 6.0 },
    { key: 'twinsunflower', name: '双头向日葵', cost: 125, hp: 100, cd: 6.0 },
    { key: 'peashooter',   name: '豌豆射手',   cost: 100, hp: 100, cd: 6.0 },
    { key: 'repeater',      name: '双发射手',   cost: 200, hp: 100, cd: 8.0 },
    { key: 'greenplum',     name: '青梅绿茶',   cost: 175, hp: 100, cd: 6.0 },
    { key: 'wallnut',       name: '坚果',       cost: 50,  hp: 400, cd: 12.0 },
    { key: 'sleepshroom',   name: '睡蘑菇',     cost: 150, hp: 800, cd: 15.0 },
    { key: 'potatomine',    name: '土豆地雷',   cost: 25,  hp: 100, cd: 20.0 }
  ];
  var CARD_Y = 8, CARD_H = 48, CARD_W = 56, CARD_GAP = 4;
  var CARD_X0 = 12;
  /* 铲子按钮 */
  var SHOVEL_W = 40;
  var shovelX = CARD_X0 + SEEDS.length * (CARD_W + CARD_GAP) + 4;

  var ZOMBIE_TYPES = {
    normal:    { hp: 100, speed: 14 },
    cone:      { hp: 200, speed: 12 },
    bucket:    { hp: 350, speed: 10 },
    naidragon: { hp: 700, speed: 11 },
    giant:     { hp: 1500, speed: 7 }
  };

  /* ================= 状态 ================= */
  var state = 'intro';
  var elSun = document.getElementById('sunCount');
  var elClock = document.getElementById('clock');
  var elBanner = document.getElementById('banner');
  var elIntro = document.getElementById('intro');
  var elOver = document.getElementById('over');
  var elOverTitle = document.getElementById('overTitle');
  var elOverStats = document.getElementById('overStats');

  var last = 0, bannerT = 0;
  var sun = 100;
  var sunCollected = 0;
  var timeLeft = GAME_TIME;
  var kills = 0;
  var grid = [];
  for (var _r = 0; _r < ROWS; _r++) {
    grid[_r] = [];
    for (var _c = 0; _c < COLS; _c++) { grid[_r][_c] = null; }
  }
  var bullets = [];
  var zombies = [];
  var suns = [];
  var particles = [];
  var selected = null;     /* 植物 key 或 'shovel' */
  var seedCooldown = {};
  var spawnTimer = 0;
  var skySunTimer = 0;
  var elapsed = 0;
  var achievementT = 0;
  var achievementShown = false;

  function banner(text, ms) {
    elBanner.textContent = text;
    elBanner.classList.add('show');
    bannerT = (ms || 1200) / 1000;
  }
  function fmt(t) {
    t = Math.max(0, t);
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function reset() {
    sun = 100; sunCollected = 0; timeLeft = GAME_TIME; kills = 0;
    elapsed = 0; spawnTimer = 12; skySunTimer = 4;
    selected = null; bannerT = 0;
    achievementT = 0; achievementShown = false;
    grid = [];
    for (var r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (var c = 0; c < COLS; c++) { grid[r][c] = null; }
    }
    bullets = []; zombies = []; suns = []; particles = [];
    seedCooldown = {};
    for (var i = 0; i < SEEDS.length; i++) { seedCooldown[SEEDS[i].key] = 0; }
    elSun.textContent = '100';
    elClock.textContent = fmt(timeLeft);
    elBanner.classList.remove('show');
    elOver.classList.remove('win', 'lose');
  }
  function start() {
    reset();
    state = 'playing';
    elIntro.classList.add('hidden');
    elOver.classList.add('hidden');
    banner('守住 5 分钟！', 1400);
  }
  function gameOver(win) {
    state = 'over';
    if (win) {
      elOverTitle.textContent = '你守住了草坪！';
      elOverStats.textContent = '撑过 5 分钟，击退僵尸 ' + kills + ' 只，累计 token ' + sunCollected + '。';
      elOver.classList.add('win');
    } else {
      elOverTitle.textContent = '僵尸冲进了家…';
      elOverStats.textContent = '坚持了 ' + Math.floor(elapsed) + ' 秒，击退僵尸 ' + kills + ' 只。';
      elOver.classList.add('lose');
    }
    elOver.classList.remove('hidden');
  }

  /* ================= 输入 ================= */
  function toWorld(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    return {
      x: (clientX - r.left) / (r.width / W),
      y: (clientY - r.top) / (r.height / H)
    };
  }

  function cardIndexAt(x, y) {
    if (y < CARD_Y || y > CARD_Y + CARD_H) return -1;
    for (var i = 0; i < SEEDS.length; i++) {
      var cx = CARD_X0 + i * (CARD_W + CARD_GAP);
      if (x >= cx && x <= cx + CARD_W) return i;
    }
    return -1;
  }
  function shovelAt(x, y) {
    if (y < CARD_Y || y > CARD_Y + CARD_H) return false;
    return x >= shovelX && x <= shovelX + SHOVEL_W;
  }
  function cellAt(x, y) {
    if (x < GRID_X || x >= GRID_X2 || y < GRID_Y || y >= GRID_Y2) return null;
    var c = Math.floor((x - GRID_X) / CW);
    var r = Math.floor((y - GRID_Y) / CH);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return { row: r, col: c };
  }

  function handlePress(wx, wy) {
    if (state !== 'playing') return;

    /* 1. 点 token */
    for (var i = suns.length - 1; i >= 0; i--) {
      var s = suns[i];
      var dx = wx - s.x, dy = wy - s.y;
      if (dx * dx + dy * dy < 28 * 28) {
        sun += s.value;
        sunCollected += s.value;
        elSun.textContent = '' + sun;
        suns.splice(i, 1);
        burst(s.x, s.y, '#5ac8ff', 8);
        if (!achievementShown && sunCollected >= 1000) {
          achievementShown = true;
          achievementT = 3;
        }
        return;
      }
    }

    /* 2. 点铲子 */
    if (shovelAt(wx, wy)) {
      if (selected === 'shovel') { selected = null; }
      else { selected = 'shovel'; }
      return;
    }

    /* 3. 点卡片 */
    var ci = cardIndexAt(wx, wy);
    if (ci >= 0) {
      var seed = SEEDS[ci];
      if (seedCooldown[seed.key] > 0) return;
      if (sun < seed.cost) { banner('token 不够', 700); return; }
      selected = (selected === seed.key) ? null : seed.key;
      return;
    }

    /* 4. 点格子 */
    var cell = cellAt(wx, wy);
    if (cell) {
      /* 铲子模式：移除植物 */
      if (selected === 'shovel') {
        var old = grid[cell.row][cell.col];
        if (old) {
          burst(old.x, old.y, '#c8a060', 12);
          grid[cell.row][cell.col] = null;
        }
        selected = null;
        return;
      }
      if (!selected) { return; }
      var selSeed = null;
      for (var k = 0; k < SEEDS.length; k++) {
        if (SEEDS[k].key === selected) { selSeed = SEEDS[k]; break; }
      }
      if (!selSeed) { selected = null; return; }
      if (sun < selSeed.cost) { banner('token 不够', 700); selected = null; return; }
      if (seedCooldown[selSeed.key] > 0) { return; }
      /* 双头向日葵：必须依附在普通向日葵上（升级替换，不算占格） */
      var existing = grid[cell.row][cell.col];
      if (selSeed.key === 'twinsunflower') {
        if (!existing || existing.type !== 'sunflower') {
          banner('双头向日葵要种在向日葵上', 1000);
          return;
        }
      } else {
        if (existing) { return; }
      }
      sun -= selSeed.cost;
      elSun.textContent = '' + sun;
      seedCooldown[selSeed.key] = selSeed.cd;
      grid[cell.row][cell.col] = {
        type: selSeed.key,
        row: cell.row, col: cell.col,
        x: GRID_X + cell.col * CW + CW / 2,
        y: GRID_Y + cell.row * CH + CH / 2,
        hp: selSeed.hp, maxHp: selSeed.hp,
        timer: 0,
        armed: false,
        stunTimer: 0
      };
      burst(GRID_X + cell.col * CW + CW / 2, GRID_Y + cell.row * CH + CH / 2, '#a8e063', 10);
      selected = null;
      return;
    }

    selected = null;
  }

  cv.addEventListener('mousedown', function (e) {
    var w = toWorld(e.clientX, e.clientY);
    handlePress(w.x, w.y);
  });
  cv.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (!e.touches || e.touches.length === 0) return;
    var t = e.touches[0];
    var w = toWorld(t.clientX, t.clientY);
    handlePress(w.x, w.y);
  }, { passive: false });

  window.addEventListener('keydown', function (e) {
    var k = (e.key || '').toLowerCase();
    if (k === 'enter' && state !== 'playing') { start(); }
    if (k === 'escape') { selected = null; }
  });
  window.addEventListener('blur', function () { selected = null; });
  document.addEventListener('visibilitychange', function () { last = 0; });

  /* ================= 粒子 ================= */
  function burst(x, y, color, n, spread) {
    if (particles.length > 260) return;
    spread = spread || 1;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (40 + Math.random() * 80) * spread;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30 * spread,
        life: 0.5 + Math.random() * 0.4,
        color: color
      });
    }
  }

  /* ================= 生成 ================= */
  function spawnZombie() {
    var row = Math.floor(Math.random() * ROWS);
    var roll = Math.random();
    var typeKey = 'normal';
    /* 开局 30 秒：所有特殊僵尸概率大幅压低 */
    var earlyFactor = elapsed < 30 ? 0.25 : 1.0;
    var bucketChance = Math.min(0.22, 0.03 + elapsed * 0.0008) * earlyFactor;
    var coneChance = Math.min(0.32, 0.14 + elapsed * 0.0006) * earlyFactor;
    /* 前 3 分钟奶龙少量出现；3 分钟后概率大幅提升 */
    var naidragonChance;
    if (elapsed < 180) {
      naidragonChance = Math.min(0.10, 0.02 + elapsed * 0.0004) * earlyFactor;
    } else {
      naidragonChance = Math.min(0.40, 0.20 + (elapsed - 180) * 0.0015);
    }
    /* 巨人：3 分 30 秒（210 秒）后开始出现，4 分钟（240 秒）后提高概率 */
    var giantChance = 0;
    if (elapsed >= 210) {
      giantChance = elapsed < 240 ? 0.08 : Math.min(0.25, 0.10 + (elapsed - 240) * 0.003);
    }
    if (roll < giantChance) {
      /* 同一行最多同时存在 2 个巨人，超限降级为普通 */
      var giantsOnRow = 0;
      for (var gi = 0; gi < zombies.length; gi++) {
        if (zombies[gi].type === 'giant' && zombies[gi].row === row) giantsOnRow++;
      }
      typeKey = (giantsOnRow >= 2) ? 'normal' : 'giant';
    }
    else if (roll < giantChance + naidragonChance) typeKey = 'naidragon';
    else if (roll < giantChance + naidragonChance + bucketChance) typeKey = 'bucket';
    else if (roll < giantChance + naidragonChance + bucketChance + coneChance) typeKey = 'cone';
    var cfg = ZOMBIE_TYPES[typeKey];
    zombies.push({
      type: typeKey,
      row: row,
      x: W + 30,
      y: GRID_Y + row * CH + CH / 2 + 6,
      hp: cfg.hp, maxHp: cfg.hp,
      speed: cfg.speed * (0.9 + Math.random() * 0.2),
      slowTimer: 0,
      poisonTimer: 0,
      poisonTick: 0,
      laughTimer: 5 + Math.random() * 3,
      laughing: 0,
      eating: false,
      eatTimer: 0
    });
  }

  function spawnSkySun() {
    var x = GRID_X + 40 + Math.random() * (GRID_X2 - GRID_X - 80);
    suns.push({ x: x, y: -20, vy: 40, targetY: GRID_Y + 60 + Math.random() * (GRID_Y2 - GRID_Y - 120), value: 25, life: 9 });
  }

  function explodeMine(p) {
    burst(p.x, p.y, '#ff6030', 30, 2.2);
    burst(p.x, p.y, '#ffd84d', 20, 1.6);
    burst(p.x, p.y, '#444', 12, 1.2);
    for (var i = zombies.length - 1; i >= 0; i--) {
      var z = zombies[i];
      var rowDist = Math.abs(z.row - p.row);
      var xDist = Math.abs(z.x - p.x);
      if (rowDist <= 1 && xDist < 80) {
        z.hp -= 800;
        if (z.hp <= 0) {
          burst(z.x, z.y, '#c0c8c0', 14);
          zombies.splice(i, 1);
          kills++;
        }
      }
    }
    grid[p.row][p.col] = null;
  }

  /* ================= 更新 ================= */
  function update(dt) {
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) { elBanner.classList.remove('show'); } }
    if (achievementT > 0) { achievementT -= dt; }

    elapsed += dt;
    timeLeft -= dt;
    elClock.textContent = fmt(timeLeft);
    if (timeLeft <= 0) { gameOver(true); return; }

    for (var k in seedCooldown) {
      if (seedCooldown[k] > 0) seedCooldown[k] = Math.max(0, seedCooldown[k] - dt);
    }

    skySunTimer -= dt;
    if (skySunTimer <= 0) {
      skySunTimer = 8 + Math.random() * 3;
      spawnSkySun();
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnZombie();
      var interval = Math.max(2.0, 7.5 - elapsed * 0.03);
      spawnTimer = interval * (0.8 + Math.random() * 0.4);
    }

    /* 植物行为 */
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var p = grid[r][c];
        if (!p) continue;
        if (p.stunTimer > 0) { p.stunTimer -= dt; continue; }
        p.timer += dt;

        if (p.type === 'sunflower') {
          if (p.timer >= 8) {
            p.timer = 0;
            suns.push({ x: p.x + 10, y: p.y - 10, vy: 0, targetY: p.y - 10, value: 25, life: 9 });
          }
        } else if (p.type === 'twinsunflower') {
          /* 双头：每 15 秒产两个 50 */
          if (p.timer >= 15) {
            p.timer = 0;
            suns.push({ x: p.x - 8, y: p.y - 14, vy: 0, targetY: p.y - 14, value: 50, life: 9 });
            suns.push({ x: p.x + 12, y: p.y - 8, vy: 0, targetY: p.y - 8, value: 50, life: 9 });
          }
        } else if (p.type === 'peashooter' || p.type === 'repeater' || p.type === 'greenplum') {
          var hasTarget = false;
          for (var zi = 0; zi < zombies.length; zi++) {
            if (zombies[zi].row === r && zombies[zi].x > p.x - 10 && zombies[zi].x < W + 20) { hasTarget = true; break; }
          }
          if (hasTarget && p.timer >= 1.4) {
            p.timer = 0;
            if (p.type === 'peashooter') {
              bullets.push({ x: p.x + 18, y: p.y - 6, row: r, vx: 340, type: 'pea', dmg: 20 });
            } else if (p.type === 'repeater') {
              bullets.push({ x: p.x + 22, y: p.y - 8, row: r, vx: 360, type: 'fire', dmg: 30 });
              bullets.push({ x: p.x + 12, y: p.y - 4, row: r, vx: 360, type: 'ice', dmg: 20 });
            } else {
              /* 青梅绿茶：果汁弹，中毒 */
              bullets.push({ x: p.x + 18, y: p.y - 6, row: r, vx: 300, type: 'juice', dmg: 15 });
            }
          }
        } else if (p.type === 'potatomine') {
          if (!p.armed && p.timer >= 15) {
            p.armed = true;
            burst(p.x, p.y - 6, '#ff5050', 6);
          }
          if (p.armed) {
            for (var zi2 = 0; zi2 < zombies.length; zi2++) {
              var z = zombies[zi2];
              if (z.row === r && Math.abs(z.x - p.x) < 38 && z.x > p.x - 20) {
                explodeMine(p);
                break;
              }
            }
          }
        }
        /* wallnut / sleepshroom：纯防御，无行为 */
      }
    }

    /* 子弹 */
    for (var bi = bullets.length - 1; bi >= 0; bi--) {
      var b = bullets[bi];
      b.x += b.vx * dt;
      if (b.x > W + 20) { bullets.splice(bi, 1); continue; }
      for (var zi3 = zombies.length - 1; zi3 >= 0; zi3--) {
        var zz2 = zombies[zi3];
        if (zz2.row !== b.row) continue;
        if (Math.abs(b.x - zz2.x) < 16 && Math.abs(b.y - zz2.y) < 30) {
          zz2.hp -= b.dmg;
          burst(b.x, b.y, b.type === 'fire' ? '#ff8030' : (b.type === 'ice' ? '#a0e0ff' : (b.type === 'juice' ? '#b8ff60' : '#9fe06a')), 5);
          if (b.type === 'ice') { zz2.slowTimer = 5; }
          if (b.type === 'juice') { zz2.poisonTimer = 2; zz2.poisonTick = 0; }
          bullets.splice(bi, 1);
          if (zz2.hp <= 0) {
            zombies.splice(zi3, 1);
            kills++;
            burst(zz2.x, zz2.y, '#c0c8c0', 14);
          }
          break;
        }
      }
    }

    /* 僵尸移动 / 吃植物 / 状态 */
    for (var zi4 = zombies.length - 1; zi4 >= 0; zi4--) {
      var zz = zombies[zi4];
      if (zz.slowTimer > 0) { zz.slowTimer -= dt; }
      /* 中毒持续伤害 */
      if (zz.poisonTimer > 0) {
        zz.poisonTimer -= dt;
        zz.poisonTick += dt;
        if (zz.poisonTick >= 0.5) {
          zz.poisonTick = 0;
          zz.hp -= 8;
          burst(zz.x, zz.y - 10, '#b8ff60', 3);
          if (zz.hp <= 0) {
            burst(zz.x, zz.y, '#c0c8c0', 14);
            zombies.splice(zi4, 1);
            kills++;
            continue;
          }
        }
      }
      /* 奶龙大笑 */
      if (zz.type === 'naidragon') {
        if (zz.laughing > 0) {
          zz.laughing -= dt;
          if (zz.laughing <= 0) {
            /* 笑完：眩晕同行 ±1 格内所有植物 */
            for (var cr = Math.max(0, zz.row - 1); cr <= Math.min(ROWS - 1, zz.row + 1); cr++) {
              for (var cc2 = 0; cc2 < COLS; cc2++) {
                var pp = grid[cr][cc2];
                if (pp && Math.abs(pp.x - zz.x) < 130) {
                  pp.stunTimer = 3;
                }
              }
            }
            burst(zz.x, zz.y - 30, '#ffd166', 10);
          }
        } else {
          zz.laughTimer -= dt;
          if (zz.laughTimer <= 0) {
            zz.laughTimer = 7 + Math.random() * 3;
            zz.laughing = 1.2;
          }
        }
      }

      var curSpeed = zz.speed * (zz.slowTimer > 0 ? 0.75 : 1);

      var zc = Math.floor((zz.x - GRID_X) / CW);
      var canEat = false;
      if (zc >= 0 && zc < COLS) {
        var plantHere = grid[zz.row][zc];
        if (plantHere && zz.x < plantHere.x + 22) {
          if (zz.type === 'giant') {
            /* 巨人：直接踩碎，无视血量 */
            burst(plantHere.x, plantHere.y, '#8a8a8a', 18, 1.5);
            grid[zz.row][zc] = null;
          } else {
            canEat = true;
            zz.eating = true;
            zz.eatTimer += dt;
            if (zz.eatTimer >= 0.6) {
              zz.eatTimer = 0;
              plantHere.hp -= 25;
              if (plantHere.hp <= 0) {
                burst(plantHere.x, plantHere.y, '#8a5a30', 12);
                grid[zz.row][zc] = null;
              }
            }
          }
        }
      }
      if (!canEat) {
        zz.eating = false;
        zz.x -= curSpeed * dt;
      }
      if (zz.x < GRID_X - 12) {
        gameOver(false);
        return;
      }
    }

    /* token 拾取物 */
    for (var si = suns.length - 1; si >= 0; si--) {
      var sn = suns[si];
      if (sn.y < sn.targetY) {
        sn.y += sn.vy * dt;
        if (sn.y > sn.targetY) sn.y = sn.targetY;
      } else {
        sn.life -= dt;
        if (sn.life <= 0) suns.splice(si, 1);
      }
    }

    /* 粒子 */
    for (var pi = particles.length - 1; pi >= 0; pi--) {
      var pt = particles[pi];
      pt.life -= dt;
      if (pt.life <= 0) { particles.splice(pi, 1); continue; }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 120 * dt;
    }
  }

  /* ================= 绘制 ================= */
  /* 伪 3D 阴影：接触阴影 + 投影 */
  function drawShadow(x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    ctx.beginPath();
    ctx.ellipse(x, y, w, (h || w * 0.28), 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLawn() {
    /* 顶部泥土条（伪 3D：明暗分层） */
    var dirtG = ctx.createLinearGradient(0, 0, 0, 72);
    dirtG.addColorStop(0, '#5a4326');
    dirtG.addColorStop(0.7, '#3a2c18');
    dirtG.addColorStop(1, '#1a1208');
    ctx.fillStyle = dirtG;
    ctx.fillRect(0, 0, W, 72);
    /* 泥土颗粒 + 高光 */
    for (var i = 0; i < 50; i++) {
      var px = (i * 97) % W;
      var py = 6 + ((i * 53) % 60);
      ctx.fillStyle = (i % 3 === 0) ? 'rgba(255,220,160,.15)' : 'rgba(0,0,0,.3)';
      ctx.fillRect(px, py, 2, 2);
    }

    /* 草坪：每行伪 3D 渐变（顶亮底暗，模拟俯视光影） */
    for (var r = 0; r < ROWS; r++) {
      var y0 = GRID_Y + r * CH;
      var rowG = ctx.createLinearGradient(0, y0, 0, y0 + CH);
      if (r % 2 === 0) {
        rowG.addColorStop(0, '#6ea848');
        rowG.addColorStop(0.5, '#558834');
        rowG.addColorStop(1, '#2f5c1c');
      } else {
        rowG.addColorStop(0, '#639a3e');
        rowG.addColorStop(0.5, '#4a7c2a');
        rowG.addColorStop(1, '#275018');
      }
      ctx.fillStyle = rowG;
      ctx.fillRect(GRID_X, y0, COLS * CW, CH);
      /* 行底部暗影（伪 3D 行间缝隙） */
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(GRID_X, y0 + CH - 3, COLS * CW, 3);
    }

    /* 草叶纹理 */
    ctx.strokeStyle = 'rgba(0,40,0,.2)';
    ctx.lineWidth = 1;
    for (var gx = GRID_X + 10; gx < GRID_X2; gx += 14) {
      for (var gy = GRID_Y + 12; gy < GRID_Y2; gy += 18) {
        ctx.beginPath();
        ctx.moveTo(gx + ((gy * 7) % 5), gy);
        ctx.lineTo(gx + 4 + ((gy * 7) % 5), gy - 5);
        ctx.stroke();
      }
    }

    /* 竖列分隔（淡） */
    ctx.strokeStyle = 'rgba(0,0,0,.12)';
    for (var c = 1; c < COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(GRID_X + c * CW, GRID_Y);
      ctx.lineTo(GRID_X + c * CW, GRID_Y2);
      ctx.stroke();
    }

    /* 左边红线 */
    ctx.strokeStyle = 'rgba(255,60,60,.85)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(GRID_X - 6, GRID_Y);
    ctx.lineTo(GRID_X - 6, GRID_Y2);
    ctx.stroke();
    ctx.setLineDash([]);

    /* 顶部阴影边 */
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(0, 72, W, 4);
  }

  function drawCard(i, x, y) {
    var seed = SEEDS[i];
    var affordable = sun >= seed.cost;
    var onCd = seedCooldown[seed.key] > 0;
    var selectedThis = (selected === seed.key);

    ctx.save();
    /* 伪 3D 卡片：顶部高光、底部阴影 */
    var bgG = ctx.createLinearGradient(x, y, x, y + CARD_H);
    bgG.addColorStop(0, selectedThis ? '#4a6a3a' : '#2a3a20');
    bgG.addColorStop(0.5, selectedThis ? '#3a5a2a' : '#1f2e18');
    bgG.addColorStop(1, '#0e180a');
    ctx.fillStyle = bgG;
    ctx.strokeStyle = selectedThis ? '#ffd166' : 'rgba(255,255,255,.3)';
    ctx.lineWidth = selectedThis ? 2.5 : 1.5;
    roundRect(x, y, CARD_W, CARD_H, 8);
    ctx.fill(); ctx.stroke();
    /* 顶部高光条 */
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    roundRect(x + 2, y + 2, CARD_W - 4, 8, 5);
    ctx.fill();

    drawPlantIcon(seed.key, x + CARD_W / 2, y + 20, 0.6, false);

    ctx.fillStyle = affordable ? '#7ad0ff' : '#ff8080';
    ctx.font = '700 10px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('◆' + seed.cost, x + CARD_W / 2, y + CARD_H - 5);

    if (onCd) {
      var ratio = seedCooldown[seed.key] / seed.cd;
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(x, y, CARD_W, CARD_H * ratio);
    }
    ctx.restore();
  }

  function drawShovelButton() {
    var selectedThis = (selected === 'shovel');
    ctx.save();
    var bgG = ctx.createLinearGradient(shovelX, CARD_Y, shovelX, CARD_Y + CARD_H);
    bgG.addColorStop(0, selectedThis ? '#6a4a2a' : '#3a2e20');
    bgG.addColorStop(1, '#1a1408');
    ctx.fillStyle = bgG;
    ctx.strokeStyle = selectedThis ? '#ffd166' : 'rgba(255,255,255,.3)';
    ctx.lineWidth = selectedThis ? 2.5 : 1.5;
    roundRect(shovelX, CARD_Y, SHOVEL_W, CARD_H, 8);
    ctx.fill(); ctx.stroke();
    /* 画铲子 */
    ctx.translate(shovelX + SHOVEL_W / 2, CARD_Y + CARD_H / 2);
    ctx.rotate(-0.5);
    /* 柄 */
    ctx.strokeStyle = '#c8a060';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, 4); ctx.stroke();
    /* 头 */
    ctx.fillStyle = '#b0b8c0';
    ctx.beginPath();
    ctx.moveTo(-6, 4); ctx.lineTo(6, 4); ctx.lineTo(4, 14); ctx.lineTo(-4, 14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPlantIcon(key, cx, cy, scale, real) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    /* 公共：底部投影椭圆（伪 3D） */
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(0, 14, 12, 4, 0, 0, Math.PI * 2); ctx.fill();

    if (key === 'sunflower') {
      ctx.fillStyle = '#2f6a2f';
      ctx.fillRect(-2, 4, 4, 14);
      for (var i = 0; i < 12; i++) {
        var a = (i / 12) * Math.PI * 2;
        ctx.save(); ctx.rotate(a);
        var petG = ctx.createLinearGradient(0, 0, 14, 0);
        petG.addColorStop(0, '#d89020');
        petG.addColorStop(1, '#ffe86a');
        ctx.fillStyle = petG;
        ctx.beginPath(); ctx.ellipse(12, 0, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      var faceG = ctx.createRadialGradient(-3, -3, 1, 0, 0, 10);
      faceG.addColorStop(0, '#fff0a0');
      faceG.addColorStop(1, '#8a5a10');
      ctx.fillStyle = faceG;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a1a08';
      ctx.beginPath(); ctx.arc(-3, -2, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3, -2, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2a1a08'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 1, 4, 0.1, Math.PI - 0.1); ctx.stroke();
    } else if (key === 'twinsunflower') {
      /* 双头向日葵：左右两朵花 */
      ctx.fillStyle = '#2f6a2f';
      ctx.fillRect(-2, 4, 4, 14);
      function drawOneFlower(fx, fy, sc) {
        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(sc, sc);
        for (var i = 0; i < 10; i++) {
          var a = (i / 10) * Math.PI * 2;
          ctx.save(); ctx.rotate(a);
          ctx.fillStyle = '#ffe86a';
          ctx.beginPath(); ctx.ellipse(10, 0, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        var fg = ctx.createRadialGradient(-1, -1, 1, 0, 0, 8);
        fg.addColorStop(0, '#fff0a0'); fg.addColorStop(1, '#a06818');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2a1a08';
        ctx.beginPath(); ctx.arc(-2, -1, 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(2, -1, 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      drawOneFlower(-7, -8, 0.9);
      drawOneFlower(7, -8, 0.9);
    } else if (key === 'peashooter' || key === 'repeater') {
      ctx.fillStyle = '#2f6a2f';
      ctx.fillRect(-2, 4, 4, 14);
      if (key === 'repeater') {
        /* 双发：红蓝相间 */
        var headG2 = ctx.createLinearGradient(-10, 0, 10, 0);
        headG2.addColorStop(0, '#ff5050');
        headG2.addColorStop(0.5, '#ffb0b0');
        headG2.addColorStop(0.5, '#b0d0ff');
        headG2.addColorStop(1, '#2060d0');
        ctx.fillStyle = headG2;
        ctx.beginPath(); ctx.arc(0, -2, 10, 0, Math.PI * 2); ctx.fill();
        /* 上嘴红、下嘴蓝 */
        ctx.fillStyle = '#a02020';
        ctx.beginPath(); ctx.arc(9, -4, 4.5, -Math.PI / 2, Math.PI / 2); ctx.fill();
        ctx.fillStyle = '#103a80';
        ctx.beginPath(); ctx.arc(9, 2, 4, -Math.PI / 2, Math.PI / 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(-2, -6, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.arc(-6, -8, 1.5, 0, Math.PI * 2); ctx.fill();
      } else {
        var headG = ctx.createRadialGradient(-4, -6, 2, 0, -2, 13);
        headG.addColorStop(0, '#b8f89a');
        headG.addColorStop(0.6, '#4a9a3a');
        headG.addColorStop(1, '#1a4a10');
        ctx.fillStyle = headG;
        ctx.beginPath(); ctx.arc(0, -2, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1a4a1a';
        ctx.beginPath(); ctx.arc(9, -2, 4.5, -Math.PI / 2, Math.PI / 2); ctx.fill();
        ctx.fillStyle = '#0a2a0a';
        ctx.beginPath(); ctx.arc(11, -2, 2.5, -Math.PI / 2, Math.PI / 2); ctx.fill();
        ctx.fillStyle = '#1a3a1a';
        ctx.beginPath(); ctx.arc(-2, -6, 1.8, 0, Math.PI * 2); ctx.fill();
      }
    } else if (key === 'greenplum') {
      /* 青梅绿茶：墨绿与黄色相间 */
      ctx.fillStyle = '#2f4a1a';
      ctx.fillRect(-2, 6, 4, 12);
      var cupG = ctx.createRadialGradient(-3, -6, 2, 0, -2, 12);
      cupG.addColorStop(0, '#f8e860');
      cupG.addColorStop(0.4, '#c0b020');
      cupG.addColorStop(0.6, '#1a4a1a');
      cupG.addColorStop(1, '#0a2a0a');
      ctx.fillStyle = cupG;
      ctx.beginPath(); ctx.arc(0, -2, 10, 0, Math.PI * 2); ctx.fill();
      /* 黄色高光 */
      ctx.fillStyle = 'rgba(255,240,120,.6)';
      ctx.beginPath(); ctx.ellipse(-3, -6, 4, 2, -0.5, 0, Math.PI * 2); ctx.fill();
      /* 杯口 */
      ctx.fillStyle = '#0a2a0a';
      ctx.beginPath(); ctx.arc(9, -2, 3.5, -Math.PI / 2, Math.PI / 2); ctx.fill();
      ctx.fillStyle = '#f8e860';
      ctx.beginPath(); ctx.arc(-2, -6, 1.5, 0, Math.PI * 2); ctx.fill();
    } else if (key === 'wallnut') {
      var nutG = ctx.createRadialGradient(-5, -6, 2, 0, 0, 15);
      nutG.addColorStop(0, '#f0d090');
      nutG.addColorStop(0.6, '#a07030');
      nutG.addColorStop(1, '#4a2a08');
      ctx.fillStyle = nutG;
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#2a1804'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 13, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#1a0e04';
      ctx.beginPath(); ctx.arc(-4, -3, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4, -3, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#1a0e04'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 3, 4, 0.2, Math.PI - 0.2); ctx.stroke();
    } else if (key === 'sleepshroom') {
      /* 睡觉蘑菇：紫色菌盖，闭眼睛 */
      /* 菌柄 */
      ctx.fillStyle = '#e8d8f0';
      ctx.fillRect(-4, 0, 8, 12);
      /* 菌盖（紫色渐变） */
      var capG = ctx.createRadialGradient(-4, -8, 2, 0, -4, 14);
      capG.addColorStop(0, '#d8b8ff');
      capG.addColorStop(0.6, '#8a5ac0');
      capG.addColorStop(1, '#3a1a6a');
      ctx.fillStyle = capG;
      ctx.beginPath(); ctx.arc(0, -4, 13, Math.PI, 0); ctx.fill();
      /* 斑点 */
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath(); ctx.arc(-6, -8, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -10, 1.5, 0, Math.PI * 2); ctx.fill();
      /* 闭眼 */
      ctx.strokeStyle = '#2a1a4a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-2, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(6, 0); ctx.stroke();
      /* Zzz */
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 8px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('z', 10, -14);
      ctx.fillText('z', 14, -18);
    } else if (key === 'potatomine') {
      ctx.fillStyle = '#4a3218';
      ctx.beginPath(); ctx.ellipse(0, 8, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
      var potG = ctx.createRadialGradient(-3, -4, 1, 0, 0, 10);
      potG.addColorStop(0, '#f0d890');
      potG.addColorStop(1, '#6a4a20');
      ctx.fillStyle = potG;
      ctx.beginPath(); ctx.ellipse(0, 0, 8, 6.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(-3, -1, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(3, -1, 1.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#a08040'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -6); ctx.quadraticCurveTo(4, -10, 2, -13); ctx.stroke();
      if (real) {
        var blink = 0.6 + 0.4 * Math.sin(elapsed * 6);
        ctx.fillStyle = 'rgba(255,60,60,' + blink.toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(2, -13, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawPlant(p) {
    /* 伪 3D 投影 */
    drawShadow(p.x + 2, p.y + 20, 18);
    drawPlantIcon(p.type, p.x, p.y, 1.4, p.armed);

    /* 眩晕：头顶旋转星星 */
    if (p.stunTimer > 0) {
      ctx.save();
      ctx.fillStyle = '#ffd166';
      ctx.font = '900 12px sans-serif';
      ctx.textAlign = 'center';
      for (var i = 0; i < 3; i++) {
        var ang = elapsed * 4 + i * (Math.PI * 2 / 3);
        var sx = p.x + Math.cos(ang) * 14;
        var sy = p.y - 28 + Math.sin(ang) * 4;
        ctx.fillText('★', sx, sy);
      }
      ctx.restore();
    }

    if (p.type === 'potatomine' && !p.armed) {
      var ratio = Math.min(1, p.timer / 15);
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(p.x - 18, p.y - 22, 36, 3);
      ctx.fillStyle = '#7ad0ff';
      ctx.fillRect(p.x - 18, p.y - 22, 36 * ratio, 3);
    }
    if (p.hp < p.maxHp) {
      var w = 40, r = p.hp / p.maxHp;
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(p.x - w / 2, p.y - 36, w, 4);
      ctx.fillStyle = r > 0.5 ? '#7ad06a' : '#ff8080';
      ctx.fillRect(p.x - w / 2, p.y - 36, w * r, 4);
    }
  }

  function drawZombie(z) {
    /* 伪 3D 投影（偏移右下） */
    drawShadow(z.x + 2, z.y + 36, z.type === 'giant' ? 28 : 17);

    ctx.save();

    /* 巨人僵尸：参照图重画——绿皮、棕发、灰绿卷袖 T 恤、深灰裤、赤脚 */
    if (z.type === 'giant') {
      var gscale = 1.55;
      ctx.translate(z.x, z.y + 6);
      ctx.scale(gscale, gscale);

      /* 赤脚（两只大脚） */
      ctx.fillStyle = '#7a9078';
      ctx.beginPath(); ctx.ellipse(-8, 30, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, 30, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      /* 脚趾 */
      ctx.fillStyle = '#5a7058';
      ctx.beginPath(); ctx.arc(-11, 29, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(-8, 30, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(11, 29, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(8, 30, 1.5, 0, Math.PI * 2); ctx.fill();

      /* 深灰裤子 */
      var pantsG = ctx.createLinearGradient(0, 10, 0, 30);
      pantsG.addColorStop(0, '#4a4a52');
      pantsG.addColorStop(1, '#2a2a32');
      ctx.fillStyle = pantsG;
      ctx.fillRect(-13, 8, 26, 22);

      /* 灰绿长袖 T 恤（壮硕身体） */
      var shirtG = ctx.createLinearGradient(0, -22, 0, 12);
      shirtG.addColorStop(0, '#a8a898');
      shirtG.addColorStop(0.6, '#8a8a7c');
      shirtG.addColorStop(1, '#5a5a50');
      ctx.fillStyle = shirtG;
      /* 身体（倒梯形壮硕） */
      ctx.beginPath();
      ctx.moveTo(-18, -20);
      ctx.lineTo(18, -20);
      ctx.lineTo(15, 10);
      ctx.lineTo(-15, 10);
      ctx.closePath();
      ctx.fill();
      /* 领口 */
      ctx.strokeStyle = '#4a4a40'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, -20, 6, 0.1, Math.PI - 0.1); ctx.stroke();
      /* 卷起的袖口 */
      ctx.fillStyle = '#6a6a5e';
      ctx.fillRect(-22, -2, 5, 10);
      ctx.fillRect(17, -2, 5, 10);

      /* 绿皮手臂（从袖口伸出） */
      var armG = ctx.createLinearGradient(-22, 0, -15, 0);
      armG.addColorStop(0, '#8aa088');
      armG.addColorStop(1, '#6a8068');
      ctx.fillStyle = armG;
      ctx.beginPath(); ctx.ellipse(-19, 8, 3.5, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(19, 8, 3.5, 8, 0, 0, Math.PI * 2); ctx.fill();
      /* 大手 */
      ctx.fillStyle = '#7a9078';
      ctx.beginPath(); ctx.ellipse(-19, 17, 4.5, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(19, 17, 4.5, 4, 0, 0, Math.PI * 2); ctx.fill();

      /* 头（绿皮，壮硕方脸） */
      var headG = ctx.createRadialGradient(-4, -32, 2, 0, -28, 14);
      headG.addColorStop(0, '#c0d4bc');
      headG.addColorStop(0.7, '#8aa088');
      headG.addColorStop(1, '#5a7058');
      ctx.fillStyle = headG;
      ctx.beginPath();
      ctx.moveTo(-11, -22);
      ctx.lineTo(-12, -34);
      ctx.quadraticCurveTo(-12, -42, 0, -42);
      ctx.quadraticCurveTo(12, -42, 12, -34);
      ctx.lineTo(11, -22);
      ctx.closePath();
      ctx.fill();
      /* 耳朵 */
      ctx.fillStyle = '#8aa088';
      ctx.beginPath(); ctx.arc(-12, -30, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(12, -30, 2.5, 0, Math.PI * 2); ctx.fill();

      /* 棕色碎短发（顶部锯齿） */
      ctx.fillStyle = '#4a3020';
      ctx.beginPath();
      ctx.moveTo(-11, -38);
      ctx.lineTo(-9, -43); ctx.lineTo(-7, -39);
      ctx.lineTo(-5, -44); ctx.lineTo(-3, -40);
      ctx.lineTo(0, -45); ctx.lineTo(2, -40);
      ctx.lineTo(5, -44); ctx.lineTo(7, -39);
      ctx.lineTo(9, -43); ctx.lineTo(11, -38);
      ctx.lineTo(10, -42); ctx.lineTo(-10, -42);
      ctx.closePath();
      ctx.fill();

      /* 粗黑浓眉 */
      ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-8, -33); ctx.lineTo(-3, -34); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3, -34); ctx.lineTo(8, -33); ctx.stroke();
      /* 棕色眼睛 */
      ctx.fillStyle = '#6a3a10';
      ctx.beginPath(); ctx.arc(-5, -30, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -30, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-5.5, -30.5, 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5, -30.5, 0.7, 0, Math.PI * 2); ctx.fill();
      /* 鼻子 */
      ctx.fillStyle = '#7a9078';
      ctx.beginPath(); ctx.arc(0, -27, 1.8, 0, Math.PI * 2); ctx.fill();
      /* 抿嘴（严肃下弯） */
      ctx.strokeStyle = '#3a2a20'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-5, -23); ctx.lineTo(5, -23); ctx.stroke();

      /* 血条 */
      if (z.hp < z.maxHp) {
        ctx.fillStyle = 'rgba(0,0,0,.6)';
        ctx.fillRect(-20, -52, 40, 5);
        ctx.fillStyle = '#ff2020';
        ctx.fillRect(-20, -52, 40 * Math.max(0, z.hp / z.maxHp), 5);
      }
      ctx.restore();
      return;
    }

    var slowed = z.slowTimer > 0;
    var poisoned = z.poisonTimer > 0;
    var laughing = z.laughing > 0;

    /* 腿 */
    var step = Math.sin(elapsed * (slowed ? 3 : 6) + z.row) * (z.eating ? 0 : 4);
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(z.x - 4, z.y + 16); ctx.lineTo(z.x - 4 + step, z.y + 32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(z.x + 4, z.y + 16); ctx.lineTo(z.x + 4 - step, z.y + 32); ctx.stroke();

    /* 身体 */
    var bodyG;
    if (z.type === 'naidragon') {
      /* 奶龙：黄色胖胖身体 */
      bodyG = ctx.createLinearGradient(0, z.y - 14, 0, z.y + 18);
      bodyG.addColorStop(0, '#ffe870');
      bodyG.addColorStop(1, '#b88820');
    } else {
      bodyG = ctx.createLinearGradient(0, z.y - 12, 0, z.y + 18);
      bodyG.addColorStop(0, '#4a4038');
      bodyG.addColorStop(1, '#1a1815');
    }
    ctx.fillStyle = bodyG;
    ctx.fillRect(z.x - 9, z.y - 12, 18, 30);

    if (z.type !== 'naidragon') {
      /* 血渍 */
      ctx.fillStyle = 'rgba(60,10,10,.7)';
      ctx.fillRect(z.x - 6, z.y - 6, 5, 4);
      ctx.fillRect(z.x + 2, z.y + 2, 6, 3);
    }

    /* 手臂 */
    var armColor = (z.type === 'naidragon') ? '#e8c040' : '#5a6a55';
    ctx.strokeStyle = armColor;
    ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.moveTo(z.x - 6, z.y - 4); ctx.lineTo(z.x - 24, z.y + (z.eating ? -3 : 2)); ctx.stroke();

    /* 头 */
    if (z.type === 'naidragon') {
      /* 奶龙头：黄色、胖、大笑 */
      var headG = ctx.createRadialGradient(z.x - 3, z.y - 24, 2, z.x, z.y - 20, 14);
      headG.addColorStop(0, '#fff0a0');
      headG.addColorStop(1, '#c89820');
      ctx.fillStyle = headG;
      ctx.beginPath(); ctx.arc(z.x, z.y - 20, 13, 0, Math.PI * 2); ctx.fill();
      /* 小角 */
      ctx.fillStyle = '#fff8d0';
      ctx.beginPath(); ctx.moveTo(z.x - 6, z.y - 32); ctx.lineTo(z.x - 4, z.y - 38); ctx.lineTo(z.x - 2, z.y - 32); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(z.x + 2, z.y - 32); ctx.lineTo(z.x + 4, z.y - 38); ctx.lineTo(z.x + 6, z.y - 32); ctx.closePath(); ctx.fill();
      /* 眼睛：笑成弯月 */
      ctx.strokeStyle = '#2a1a08'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(z.x - 5, z.y - 22, 2.5, Math.PI, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(z.x + 4, z.y - 22, 2.5, Math.PI, Math.PI * 2); ctx.stroke();
      /* 嘴：大笑（或闭嘴） */
      ctx.fillStyle = '#5a2010';
      if (laughing) {
        ctx.beginPath(); ctx.arc(z.x, z.y - 14, 5, 0, Math.PI); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(z.x, z.y - 15, 4, 0.1, Math.PI - 0.1); ctx.stroke();
      }
      /* 笑时飘音符 */
      if (laughing) {
        ctx.fillStyle = '#ff60a0';
        ctx.font = '900 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('哈哈', z.x + 10, z.y - 44 - Math.sin(elapsed * 6) * 4);
      }
    } else {
      /* 普通僵尸头 */
      var skinG = ctx.createRadialGradient(z.x - 3, z.y - 24, 2, z.x, z.y - 20, 13);
      skinG.addColorStop(0, '#8aa080');
      skinG.addColorStop(0.6, '#5a6a50');
      skinG.addColorStop(1, '#2a3525');
      ctx.fillStyle = skinG;
      ctx.beginPath(); ctx.arc(z.x, z.y - 20, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.beginPath(); ctx.ellipse(z.x, z.y - 14, 8, 3, 0, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath(); ctx.arc(z.x - 5, z.y - 22, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(z.x + 3, z.y - 22, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = slowed ? '#a0e0ff' : '#ff3030';
      ctx.beginPath(); ctx.arc(z.x - 5, z.y - 22, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(z.x + 3, z.y - 22, 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(z.x - 6, z.y - 14); ctx.lineTo(z.x + 5, z.y - 13); ctx.stroke();
    }

    /* 头上装备 */
    if (z.type === 'cone') {
      var coneG = ctx.createLinearGradient(z.x - 10, z.y - 46, z.x + 10, z.y - 26);
      coneG.addColorStop(0, '#f0a050');
      coneG.addColorStop(1, '#5a2a08');
      ctx.fillStyle = coneG;
      ctx.beginPath();
      ctx.moveTo(z.x - 11, z.y - 26); ctx.lineTo(z.x + 11, z.y - 26); ctx.lineTo(z.x, z.y - 46);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#2a1404'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (z.type === 'bucket') {
      var buckG = ctx.createLinearGradient(z.x - 10, z.y - 42, z.x + 10, z.y - 24);
      buckG.addColorStop(0, '#c0d0e0');
      buckG.addColorStop(1, '#2a3440');
      ctx.fillStyle = buckG;
      ctx.fillRect(z.x - 10, z.y - 42, 20, 18);
      ctx.strokeStyle = '#1a222c'; ctx.lineWidth = 1.5;
      ctx.strokeRect(z.x - 10, z.y - 42, 20, 18);
    }

    /* 中毒：冒绿泡 */
    if (poisoned) {
      ctx.fillStyle = 'rgba(160,255,80,.6)';
      ctx.beginPath(); ctx.arc(z.x - 4, z.y - 8, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(z.x + 5, z.y - 4, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    /* 寒冰 */
    if (slowed) {
      ctx.fillStyle = 'rgba(140,200,255,.3)';
      ctx.beginPath(); ctx.arc(z.x, z.y - 16, 16, 0, Math.PI * 2); ctx.fill();
    }

    /* 血条 */
    if (z.hp < z.maxHp) {
      var w = 34, ratio = Math.max(0, z.hp / z.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(z.x - w / 2, z.y - 56, w, 4);
      ctx.fillStyle = '#ff4040';
      ctx.fillRect(z.x - w / 2, z.y - 56, w * ratio, 4);
    }
    ctx.restore();
  }

  /* 蓝色 token */
  function drawSun(s) {
    ctx.save();
    var pulse = 1 + Math.sin(elapsed * 5) * 0.06;
    ctx.translate(s.x, s.y);
    ctx.scale(pulse, pulse);
    var halo = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
    halo.addColorStop(0, 'rgba(80,180,255,.6)');
    halo.addColorStop(1, 'rgba(80,180,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    var core = ctx.createRadialGradient(-3, -3, 2, 0, 0, 14);
    core.addColorStop(0, '#e0f8ff');
    core.addColorStop(0.5, '#40b8ff');
    core.addColorStop(1, '#0a5ab0');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#0a3a70'; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 8px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('token', 0, 0);
    ctx.restore();
  }

  function drawSlogan() {
    var text = '可以用token购买强力武器！！！';
    ctx.save();
    ctx.font = '900 14px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    var tx = W - 40, ty = H - 6;          /* 往中间收一点，手机上不会被右边缘切掉 */
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,.85)';
    ctx.strokeText(text, tx, ty);
    ctx.shadowColor = '#ff2bd6';
    ctx.shadowBlur = 10;
    var g = ctx.createLinearGradient(0, ty - 14, 0, ty);
    g.addColorStop(0, '#fff860');
    g.addColorStop(1, '#ffb020');
    ctx.fillStyle = g;
    ctx.fillText(text, tx, ty);
    ctx.restore();
  }

  function drawAchievement() {
    if (achievementT <= 0) return;
    var alpha = Math.min(1, achievementT / 0.4) * Math.min(1, (3 - achievementT) / 0.2);
    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    var bw = 260, bh = 64;
    var bx = W - bw - 10;
    var by = H - 10 - bh - 30;
    var g = ctx.createLinearGradient(bx, by, bx, by + bh);
    g.addColorStop(0, 'rgba(40,30,10,.95)');
    g.addColorStop(1, 'rgba(20,15,5,.95)');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2;
    roundRect(bx, by, bw, bh, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(bx + 28, by + bh / 2, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8a5a10';
    ctx.font = '900 16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('★', bx + 28, by + bh / 2 + 1);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 13px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('成就解锁', bx + 50, by + 22);
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 16px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText('「一毛不拔」', bx + 50, by + 44);
    ctx.restore();
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 0.95);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    ctx.setTransform(UNIT, 0, 0, UNIT, 0, 0);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#3a5a3a');
    g.addColorStop(0.12, '#2f4a2a');
    g.addColorStop(1, '#0e1a0e');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    drawLawn();

    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (grid[r][c]) drawPlant(grid[r][c]);
      }
    }

    /* 子弹 */
    for (var bi = 0; bi < bullets.length; bi++) {
      var b = bullets[bi];
      var pea;
      if (b.type === 'fire') {
        pea = ctx.createRadialGradient(b.x - 1, b.y - 1, 1, b.x, b.y, 6);
        pea.addColorStop(0, '#fff0a0'); pea.addColorStop(0.5, '#ff8020'); pea.addColorStop(1, '#a02010');
      } else if (b.type === 'ice') {
        pea = ctx.createRadialGradient(b.x - 1, b.y - 1, 1, b.x, b.y, 6);
        pea.addColorStop(0, '#ffffff'); pea.addColorStop(0.5, '#90e0ff'); pea.addColorStop(1, '#2060c0');
      } else if (b.type === 'juice') {
        pea = ctx.createRadialGradient(b.x - 1, b.y - 1, 1, b.x, b.y, 6);
        pea.addColorStop(0, '#f8ffb0'); pea.addColorStop(0.5, '#b8ff60'); pea.addColorStop(1, '#4a8a10');
      } else {
        pea = ctx.createRadialGradient(b.x - 1, b.y - 1, 1, b.x, b.y, 5);
        pea.addColorStop(0, '#c8f89a'); pea.addColorStop(1, '#3a8a20');
      }
      ctx.fillStyle = pea;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.type === 'pea' ? 5 : 6, 0, Math.PI * 2); ctx.fill();
    }

    for (var zi = 0; zi < zombies.length; zi++) drawZombie(zombies[zi]);
    for (var si = 0; si < suns.length; si++) drawSun(suns[si]);

    for (var pi = 0; pi < particles.length; pi++) {
      var pt = particles[pi];
      ctx.globalAlpha = Math.max(0, pt.life * 2);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    for (var i = 0; i < SEEDS.length; i++) {
      var cx = CARD_X0 + i * (CARD_W + CARD_GAP);
      drawCard(i, cx, CARD_Y);
    }
    drawShovelButton();

    if (selected && state === 'playing') {
      ctx.strokeStyle = 'rgba(255,209,102,.6)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(GRID_X, GRID_Y, COLS * CW, ROWS * CH);
      ctx.setLineDash([]);
    }

    drawVignette();
    drawAchievement();
    drawSlogan();
  }

  /* ================= 主循环 ================= */
  function tick(ts) {
    var now = ts / 1000;
    if (!last) { last = now; }
    var dt = Math.min(0.05, Math.max(0, now - last));
    last = now;
    if (state === 'playing') { update(dt); }
    draw();
  }
  function loop(ts) { tick(ts); requestAnimationFrame(loop); }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
