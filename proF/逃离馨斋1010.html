<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>逃离馨斋1010</title>
<link rel="stylesheet" href="../ui/yc-ui.css">
<style>
  /* 本游戏专属微调：只碰 HUD 与弹层，不改 ../ui/yc-ui.css */
  #hud > div { display: flex; align-items: center; gap: 6px; }
  .chip .bar {
    display: inline-block; width: 74px; height: 7px; margin-left: 6px;
    border-radius: 4px; background: rgba(255,255,255,.15); vertical-align: middle; overflow: hidden;
  }
  .chip .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff5d5d, #ffb347); }
  #stChip .bar i { background: linear-gradient(90deg, #2f7bf6, #9fe0ff); }

  /* 死亡结算：整屏血红 */
  #over.blood { background: rgba(96,0,10,.88); }
  #over.blood .panel h1 { color: #ffd2d2; text-shadow: 0 0 18px rgba(255,40,40,.75); font-size: 19px; letter-spacing: .5px; }
  #over.blood .panel p { color: #f0b9b9; }
  #over.blood .btn { background: linear-gradient(135deg, #a11426, #e0313f); box-shadow: 0 8px 22px rgba(200,30,50,.5); }

  @media (max-width: 760px), (max-height: 620px) {
    .chip .bar { width: 42px; height: 6px; margin-left: 4px; }
    #over.blood .panel h1 { font-size: 14px; }
  }
</style>
</head>
<body data-pc-only="1">
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud">
      <div>
        <div class="chip" id="hpChip">生命<span class="bar"><i id="hpBar"></i></span></div>
        <div class="chip" id="stChip">体力<span class="bar"><i id="stBar"></i></span></div>
      </div>
      <div>
        <div class="chip">钥匙 <b id="keyNum">0</b></div>
        <div class="chip" id="floorChip">10F</div>
      </div>
    </div>

    <div id="banner"></div>
    <div id="hint">WASD 移动 · Shift 奔跑 · F 交互</div>

    <div class="overlay" id="intro">
      <div class="panel">
        <h1>逃离馨斋1010</h1>
        <p>你在 1010 宿舍醒来，楼里断电了。</p>
        <p>下楼梯会把手里所有钥匙一次用掉：有多少把就一口气下多少层，最多到 1 楼。</p>
        <p>电梯会收走 1 把钥匙，直接送到一楼门禁。</p>
        <button class="btn" id="startBtn" type="button">开始游戏</button>
      </div>
    </div>

    <div class="overlay hidden" id="over">
      <div class="panel">
        <h1>被宿管阿姨逮住了！明天教务处见！</h1>
        <p id="overStats"></p>
        <button class="btn" id="retryBtn" type="button">再来一局</button>
      </div>
    </div>

    <div class="overlay hidden" id="win">
      <div class="panel">
        <h1>逃出去了</h1>
        <p id="winStats"></p>
        <button class="btn" id="winBtn" type="button">再来一局</button>
      </div>
    </div>

    <div class="overlay hidden" id="mobile">
      <div class="panel">
        <h1>这个游戏只能在电脑上玩</h1>
        <p>「逃离馨斋1010」需要键盘 / 鼠标，手机 / 平板上没法正常操作。</p>
        <p>请用电脑打开本页面，或回主页挑个手机能玩的游戏</p>
        <button class="btn" id="mobileBack" type="button">返回主页</button>
      </div>
    </div>
  </div>
</div>

<script src="../ui/yc-ui.js"></script>
<script>
(function () {
  'use strict';

  /* ============================================================
     0. 基础常量
     ============================================================ */
  var G = 16;                      /* 一个网格单位 = 16 世界像素 */
  var GX0 = 4, GYTOP = 85;         /* 网格 → 世界像素的翻转原点（网格 Y 向上，屏幕 Y 向下） */
  var W = 900, H = 560;            /* 逻辑视口尺寸 */
  var FOG_R = 250;                 /* 玩家视野半径（设计文档：250px） */
  var FOG_STAIR = 100;             /* 走楼梯后的极端黑暗（设计文档：100px） */
  var FOG_ROOM = 250;              /* 宿舍内部视野（六人寝比走廊还大，给足一点） */
  var NEED_KEY = 3;                /* 成功逃离所需钥匙（设计文档：至少 3 把） */
  var NEED_ELEV = 4;               /* 电梯会收走一把钥匙，所以手里要有 4 把 */
  var HOLD_ELEV = 3, HOLD_GATE = 5;
  var HOLD_STAIRS = 1;             /* 下楼梯长按读条（秒） */
  var DOOR_TIME = 0.5;             /* 进/出宿舍推门读条（秒） */
  var MAX_KEY = 10;                /* 设计文档：钥匙总数不超过 10 把 */

  /* 宿舍内部：统一的六人寝竖长方形模板 */
  var ROOM_BOX = { x0: 250, y0: 60, x1: 650, y1: 540 };
  var ROOM_DOOR = { x: 450, y: 540 };            /* 门在下方正中 */
  var ROOM_ITEM = { x: 450, y: 330 };            /* 道具刷在房间中间 */
  var BUNK = [                                   /* 三张竖放的上下铺：左上角 / 右上角 / 右下角 */
    { x0: 264, y0: 76,  x1: 348, y1: 224 },
    { x0: 552, y0: 76,  x1: 636, y1: 224 },
    { x0: 552, y0: 372, x1: 636, y1: 520 }
  ];
  var DESK4 = { x0: 264, y0: 228, x1: 308, y1: 368 };   /* 靠左墙的并排四座长桌 */
  var DESK2 = { x0: 592, y0: 240, x1: 636, y1: 344 };   /* 另一边靠右墙的两个座位 */
  var CABINET = { x0: 264, y0: 372, x1: 308, y1: 512 }; /* 贴左墙的六人柜 */
  var FURN = BUNK.concat([DESK4, DESK2, CABINET]);      /* 以上都挡人 */
  var CHECK_AFTER = 11;            /* 在宿舍里待超过这么久，才可能把宿管引过来 */
  var CHECK_CD = 22;              /* 两次查寝之间的冷却 */
  var CHECK_SCAN = 3.2;           /* 手电扫视时长 */
  var LOBBY_BACK = { x: 370, y: 462 };  /* 一楼楼梯口（原路回十楼）的位置 */

  /* ============================================================
     1. 画布与自适应
     ============================================================ */
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var st = document.getElementById('stage');
  var UNIT = 1;

  function resize() {
    /* 可用区域 = 视口减去 #wrap 的内边距（ui/yc-ui.css 里 padding:10px）再留点余量。
       缩放不能再加下限：下限会把画布顶得比容器还宽，#stage 是 flex item 会被压扁，
       画布右侧被 overflow:hidden 以方角裁掉，开局遮罩的圆角就盖不住右上 / 右下两个角。 */
    var availW = Math.max(160, window.innerWidth - 24);
    var availH = Math.max(160, window.innerHeight - 24);
    var s = Math.min(availW / W, availH / H);
    var dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W * s * dpr);
    cv.height = Math.round(H * s * dpr);
    cv.style.width = Math.min(availW, Math.round(W * s)) + 'px';
    cv.style.height = Math.min(availH, Math.round(H * s)) + 'px';
    st.style.width = cv.style.width;
    st.style.height = cv.style.height;
    UNIT = s * dpr;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
  resize();

  /* ============================================================
     2. DOM 外壳
     ============================================================ */
  var elBanner = document.getElementById('banner');
  var elIntro = document.getElementById('intro');
  var elOver = document.getElementById('over');
  var elWin = document.getElementById('win');
  var elOverStats = document.getElementById('overStats');
  var elWinStats = document.getElementById('winStats');
  var elHpBar = document.getElementById('hpBar');
  var elStBar = document.getElementById('stBar');
  var elKeyNum = document.getElementById('keyNum');
  var elFloor = document.getElementById('floorChip');

  /* ============================================================
     3. 坐标换算
     ============================================================ */
  function gx(v) { return (v - GX0) * G; }          /* 网格 X → 世界像素 X */
  function gy(v) { return (GYTOP - v) * G; }        /* 网格 Y → 世界像素 Y（翻转） */
  function pxRect(g) { return { x0: gx(g[0]), y0: gy(g[3]), x1: gx(g[2]), y1: gy(g[1]) }; }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  /* 各处长按读条要按多久（秒） */
  function holdNeedOf(t) {
    if (t === 'gate') { return HOLD_GATE; }
    if (t === 'stairs') { return HOLD_STAIRS; }
    return HOLD_ELEV;
  }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  /* ============================================================
     4. 地图数据（网格坐标）
        · 顶部横向走廊 (13,65)-(93,75)
        · 右侧纵向走廊 (86,19)-(93,65)，南端是墙
        宿舍沿走廊两侧紧挨着排、不留缝，正对面的两间房号相邻
        （1010 对面是 1009，1008 对面是 1007 …）；
        楼梯 / 电梯 / 出口 / 厕所都做成走廊里的地面区域，不占宿舍位置。
        顶部走廊：拐角第一间是 1019（上方）/ 1020（下方），往西 1021–1023
        对面上方是厕所，1024–1031 两两相对，1032–1038（单侧，下方）
        对面是四部电梯的电梯间，最西端只剩一间（1039/1040）。
        右侧走廊：1001 正对面是厕所。
     ============================================================ */
  var AREA_G = [
    /* 顶部走廊：整体拉长，西端 x16.33、东端拐角 x123 */
    { g: [16.3333, 65, 123, 75], kind: 'corridor',
      open: [{ s: 'B', a: 116, b: 123 }, { s: 'B', a: 20.1667, b: 27.8333 },
             { s: 'B', a: 96.8333, b: 108.3333 },
             { s: 'T', a: 65.0833, b: 71.0833 }] },
    /* 最左侧唯一的安全出口：正对上方 1050 / 1051，只挂安全出口牌 */
    { g: [20.1667, 55, 27.8333, 65], kind: 'stairs',
      open: [{ s: 'T', a: 20.1667, b: 27.8333 }] },
    /* 四部电梯的电梯间：1032–1038 正对面，左右墙各两部电梯，门只开两个人宽 */
    { g: [54.6667, 75, 81.5, 85], kind: 'elev', quad: 1, doorGlow: 1,
      open: [{ s: 'B', a: 65.0833, b: 71.0833 }] },
    /* 顶部走廊：1021–1023 对面的厕所 */
    { g: [96.8333, 55, 108.3333, 65], kind: 'wc',
      open: [{ s: 'T', a: 96.8333, b: 108.3333 }] },
    { g: [116, 19, 123, 65], kind: 'corridor',
      open: [{ s: 'T', a: 116, b: 123 },
             { s: 'L', a: 19, b: 22.8333 }, { s: 'L', a: 31, b: 37 }] },
    /* 电梯间：门开在右边（靠走廊），只留两个人宽 */
    { g: [108, 29, 116, 39], kind: 'elev', doorGlow: 1,
      open: [{ s: 'R', a: 31, b: 37 }] },
    /* 1001 正对面：厕所，和 1001 一样宽，门朝右侧走廊 */
    { g: [108, 19, 116, 22.8333], kind: 'wc',
      open: [{ s: 'R', a: 19, b: 22.8333 }] }
  ];

  /* 宿舍进深（网格单位）；沿走廊的长度由「跨度 ÷ 房间数」自动算，两者相等 → 正方形且不留缝 */
  var ROOM_D = 3.8333;

  /* 实心墙体块（网格）：旧厕所搬走后留下的空档、旧楼梯挪走后的位置，直接填成墙 */
  var WALL_FILL_G = [
    [108, 22.8333, 116, 29],
    [112.1667, 39, 116, 42]
  ];
  var WALL_FILL_COL = '#0d1521';   /* 比虚空亮、比地面/电梯间暗，看着是一整块实心墙 */

  /* 每一排宿舍：沿哪条轴排、排布跨度、贴走廊的那条边（门就开在这条边上）
     顶部走廊（东→西）：1019（最东，挨着拐角）| 1021 1022 1023 | 1025 1027 1029 1031 |
                       四部电梯的电梯间 | 1040
     下方那排：1020 | 厕所（对 1021–1023） | 1024 1026 1028 1030 | 1032–1038 | 1039
     右侧走廊：北段也是左右成对（1018|1017 … 1008|1007，1010 正对 1009），
     南段 1007–1001 单排全在东侧（走廊左侧是墙，1001 正对面是厕所）。 */
  var ROWS = [
    /* 顶部走廊上方（北侧），西→东：西端单独一间 + 1050/1051 + 7 间 + 电梯间西侧 7 间 +
       电梯间东侧 1031 1029 1027 1025 + 1023 1022 1021 + 拐角 1019 */
    { nums: ['1055'], axis: 'x', span: [16.3333, 20.1667], edge: 'B', at: 75 },
    { nums: ['1050', '1051'], axis: 'x', span: [20.1667, 27.8333], edge: 'B', at: 75 },
    { nums: ['1039', '1041', '1043', '1045', '1047', '1049', '1052'],
      axis: 'x', span: [27.8333, 54.6667], edge: 'B', at: 75 },
    { nums: ['1031', '1029', '1027', '1025'], axis: 'x', span: [81.5, 96.8333], edge: 'B', at: 75 },
    { nums: ['1023', '1022', '1021'], axis: 'x', span: [96.8333, 108.3333], edge: 'B', at: 75 },
    { nums: ['1019'], axis: 'x', span: [108.3333, 112.1667], edge: 'B', at: 75 },
    /* 顶部走廊下方（南侧），西→东：安全出口占西端 2 间的位置 + 7 间 + 1032–1038 +
       1030 1028 1026 1024 + 厕所占 3 间 + 拐角 1020 */
    { nums: ['1040', '1042', '1044', '1046', '1048', '1053', '1054'],
      axis: 'x', span: [27.8333, 54.6667], edge: 'T', at: 65 },
    { nums: ['1032', '1033', '1034', '1035', '1036', '1037', '1038'],
      axis: 'x', span: [54.6667, 81.5], edge: 'T', at: 65 },
    { nums: ['1030', '1028', '1026', '1024'], axis: 'x', span: [81.5, 96.8333], edge: 'T', at: 65 },
    { nums: ['1020'], axis: 'x', span: [108.3333, 112.1667], edge: 'T', at: 65 },
    /* 右侧走廊西侧：只有北段 6 间（双数），从南往北 1008 → 1018 */
    { nums: ['1008', '1010', '1012', '1014', '1016', '1018'],
      axis: 'y', span: [42, 65], edge: 'R', at: 116 },
    /* 右侧走廊东侧：整排 12 间，从南往北 1001 → 1017（南段单排，北段与西侧成对） */
    { nums: ['1001', '1002', '1003', '1004', '1005', '1006', '1007',
             '1009', '1011', '1013', '1015', '1017'],
      axis: 'y', span: [19, 65], edge: 'L', at: 123 }
  ];

  /* 由每一排生成宿舍网格矩形：[房号, x0, y0, x1, y1]
     直接用上一间的右边当下一间的左边，避免浮点误差在墙上留出缝隙 */
  var ROOM_G = (function () {
    var out = [];
    for (var i = 0; i < ROWS.length; i++) {
      var row = ROWS[i], n = row.nums.length;
      var pitch = (row.span[1] - row.span[0]) / n;   /* 每间的间距 = 房间长度，紧挨着排 */
      var a0 = row.span[0];
      for (var k = 0; k < n; k++) {
        var a1 = (k === n - 1) ? row.span[1] : a0 + pitch;
        var x0, y0, x1, y1;
        if (row.axis === 'x') {
          x0 = a0; x1 = a1;
          if (row.edge === 'B') { y0 = row.at; y1 = row.at + ROOM_D; }
          else { y0 = row.at - ROOM_D; y1 = row.at; }
        } else {
          y0 = a0; y1 = a1;
          if (row.edge === 'L') { x0 = row.at; x1 = row.at + ROOM_D; }
          else { x0 = row.at - ROOM_D; x1 = row.at; }
        }
        out.push([row.nums[k], x0, y0, x1, y1]);
        a0 = a1;
      }
    }
    return out;
  })();

  /* 设施（都放在走廊地面上，不占宿舍的位置） */
  var FAC_G = [
    /* 最左侧那个安全出口（只有一块牌子） */
    { t: 'stairs', g: [20.6, 55.6, 27.4, 64.4], custom: 1 },
    /* 电梯间上方的安全出口：站在牌子下面按 F 下楼 */
    { t: 'stairs', g: [66.6, 84, 69.6, 85], custom: 1 },     /* 四部电梯的电梯间（顶部） */
    { t: 'stairs', g: [109, 37.3, 115, 38.6], custom: 1 },   /* 右侧走廊电梯间（顶部） */
    /* 四部电梯：左右墙各两部，所以左右各一块触发区 */
    { t: 'elev',   g: [55.2, 76, 59, 82.5], custom: 1 },
    { t: 'elev',   g: [77, 76, 81, 82.5], custom: 1 },
    { t: 'elev',   g: [108.6, 29.4, 115.4, 32], custom: 1 },  /* 右侧走廊电梯间：电梯门前那一块 */
    { t: 'exit',   g: [118.6, 74.5, 121.4, 75], custom: 1 }   /* 安全出口牌：贴在走廊北墙上，不占路面 */
  ];

  /* ============================================================
     5. 数据展开到世界像素
     ============================================================ */
  var areas = [], rooms = [], facs = [], worldRect = { x0: 0, y0: 0, x1: W, y1: H };
  var wcRects = [], elevRects = [], stairRects = [], wallFills = [];

  (function buildMap() {
    var i, a, o, r, xs = [], ys = [];

    for (i = 0; i < AREA_G.length; i++) {
      a = AREA_G[i];
      r = pxRect(a.g);
      var opens = [];
      for (var k = 0; k < (a.open || []).length; k++) {
        o = a.open[k];
        if (o.s === 'T' || o.s === 'B') { opens.push({ s: o.s, p0: gx(o.a), p1: gx(o.b) }); }
        else { opens.push({ s: o.s, p0: gy(o.b), p1: gy(o.a) }); }
      }
      areas.push({ p: r, kind: a.kind, opens: opens, doorGlow: a.doorGlow ? 1 : 0 });
      xs.push(r.x0, r.x1); ys.push(r.y0, r.y1);
      if (a.kind === 'elev') { r.quad = a.quad ? 1 : 0; elevRects.push(r); }
      if (a.kind === 'wc') { wcRects.push(r); }
      if (a.kind === 'stairs') { stairRects.push(r); }
    }

    for (i = 0; i < ROOM_G.length; i++) {
      r = pxRect(ROOM_G[i].slice(1));
      rooms.push({
        n: ROOM_G[i][0], idx: parseInt(ROOM_G[i][0], 10) - 1000, r: r,
        cx: (r.x0 + r.x1) / 2, cy: (r.y0 + r.y1) / 2,
        door: null, item: null, taken: false
      });
      xs.push(r.x0, r.x1); ys.push(r.y0, r.y1);
    }

    /* 门牌号跟着楼层走：10 层 → 10xx，9 层 → 09xx，1 层 → 01xx（见 roomLabel） */

    for (i = 0; i < WALL_FILL_G.length; i++) {
      wallFills.push(pxRect(WALL_FILL_G[i]));
    }



    for (i = 0; i < FAC_G.length; i++) {
      r = pxRect(FAC_G[i].g);
      facs.push({ t: FAC_G[i].t, p: r, cx: (r.x0 + r.x1) / 2, cy: (r.y0 + r.y1) / 2,
                  custom: !!FAC_G[i].custom });
    }

    for (i = 0; i < xs.length; i++) {
      worldRect.x0 = Math.min(worldRect.x0, xs[i]);
      worldRect.x1 = Math.max(worldRect.x1, xs[i]);
    }
    for (i = 0; i < ys.length; i++) {
      worldRect.y0 = Math.min(worldRect.y0, ys[i]);
      worldRect.y1 = Math.max(worldRect.y1, ys[i]);
    }
  })();

  /* 走廊 / 设施区域都是可行走区域（宿舍内部走独立场景，走廊这边只认墙体） */
  function walkable(x, y) {
    for (var i = 0; i < areas.length; i++) {
      var r = areas[i].p;
      if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) { return true; }
    }
    return false;
  }

  /* 墙体碰撞：把每块区域真正画出来的墙段记下来，只留开口能过 —— 不然会从墙上直接走过去 */
  var WALL_HALF = 3.5;            /* 墙线 7px 宽，半宽 3.5 */
  var wallBands = [];
  (function buildWallBands() {
    var SIDES = ['T', 'B', 'L', 'R'], i, j, s, a, r, segs, sd;
    for (i = 0; i < areas.length; i++) {
      a = areas[i]; r = a.p;
      for (j = 0; j < SIDES.length; j++) {
        sd = SIDES[j];
        segs = wallSegs(sd, r, a.opens);
        for (s = 0; s < segs.length; s++) {
          if (segs[s][1] - segs[s][0] < 2) { continue; }
          if (sd === 'T') { wallBands.push({ x0: segs[s][0], y0: r.y0, x1: segs[s][1], y1: r.y0 }); }
          else if (sd === 'B') { wallBands.push({ x0: segs[s][0], y0: r.y1, x1: segs[s][1], y1: r.y1 }); }
          else if (sd === 'L') { wallBands.push({ x0: r.x0, y0: segs[s][0], x1: r.x0, y1: segs[s][1] }); }
          else { wallBands.push({ x0: r.x1, y0: segs[s][0], x1: r.x1, y1: segs[s][1] }); }
        }
      }
    }
  })();

  /* 点到墙段的距离小于「半径 + 墙半宽」就算撞墙 */
  function hitsWall(x, y, rad) {
    var lim = rad + WALL_HALF, lim2 = lim * lim, i, b, cx, cy, dx, dy;
    for (i = 0; i < wallBands.length; i++) {
      b = wallBands[i];
      cx = x < b.x0 ? b.x0 : (x > b.x1 ? b.x1 : x);
      cy = y < b.y0 ? b.y0 : (y > b.y1 ? b.y1 : y);
      dx = x - cx; dy = y - cy;
      if (dx * dx + dy * dy < lim2) { return true; }
    }
    return false;
  }

  /* 射线打墙：返回从 (ox,oy) 沿 (dx,dy) 走到第一堵墙的距离（没墙就是 maxT），手电光锥用它裁剪 */
  function rayDist(ox, oy, dx, dy, maxT) {
    var best = maxT, w = WALL_HALF, i, b, t1, t2, tmin, tmax, x0, x1, y0, y1;
    for (i = 0; i < wallBands.length; i++) {
      b = wallBands[i];
      x0 = b.x0 - w; x1 = b.x1 + w; y0 = b.y0 - w; y1 = b.y1 + w;
      if (dx === 0) {
        if (ox < x0 || ox > x1) { continue; }
        tmin = -Infinity; tmax = Infinity;
      } else {
        t1 = (x0 - ox) / dx; t2 = (x1 - ox) / dx;
        tmin = Math.min(t1, t2); tmax = Math.max(t1, t2);
      }
      if (dy === 0) {
        if (oy < y0 || oy > y1) { continue; }
      } else {
        t1 = (y0 - oy) / dy; t2 = (y1 - oy) / dy;
        tmin = Math.max(tmin, Math.min(t1, t2));
        tmax = Math.min(tmax, Math.max(t1, t2));
      }
      if (tmax < 0 || tmin > tmax) { continue; }
      if (tmin > 0 && tmin < best) { best = tmin; }
      else if (tmin <= 0 && tmax > 0) { best = 0; }
    }
    return best;
  }

  /* 圆形实体是否能站在这里：区域里 + 不压墙 + 中心和 8 个采样点都成立 */
  function circleOk(x, y, rad) {
    if (!walkable(x, y)) { return false; }
    if (hitsWall(x, y, rad)) { return false; }
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      if (!walkable(x + Math.cos(a) * rad, y + Math.sin(a) * rad)) { return false; }
    }
    return true;
  }

  /* 视线检查：两点之间不能穿墙（先看区域，再看真正的墙体） */
  function losClear(x0, y0, x1, y1) {
    var dx = x1 - x0, dy = y1 - y0;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1) { return true; }
    var steps = Math.min(40, Math.ceil(d / 12));
    for (var i = 1; i < steps; i++) {
      var t = i / steps;
      var px = x0 + dx * t, py = y0 + dy * t;
      if (!walkable(px, py)) { return false; }
      if (hitsWall(px, py, 4)) { return false; }   /* 隔墙看不见 */
    }
    return true;
  }

  (function buildDoors() {
    var SIDES = ['B', 'T', 'L', 'R'];
    for (var i = 0; i < rooms.length; i++) {
      var r = rooms[i].r, best = null;
      for (var s = 0; s < 4; s++) {
        var sd = SIDES[s];
        var horiz = (sd === 'T' || sd === 'B');
        var e0 = horiz ? r.x0 : r.y0;
        var e1 = horiz ? r.x1 : r.y1;
        var runStart = null, bestRun = null;
        for (var t = e0; t <= e1; t += 4) {
          var ox, oy;
          if (sd === 'T') { ox = t; oy = r.y0 - 12; }
          else if (sd === 'B') { ox = t; oy = r.y1 + 12; }
          else if (sd === 'L') { ox = r.x0 - 12; oy = t; }
          else { ox = r.x1 + 12; oy = t; }
          if (walkable(ox, oy)) {
            if (runStart === null) { runStart = t; }
          } else if (runStart !== null) {
            if (!bestRun || (t - runStart) > bestRun.len) { bestRun = { a: runStart, b: t, len: t - runStart }; }
            runStart = null;
          }
        }
        if (runStart !== null && (!bestRun || (e1 - runStart) > bestRun.len)) {
          bestRun = { a: runStart, b: e1, len: e1 - runStart };
        }
        if (bestRun && bestRun.len >= 8 && (!best || bestRun.len > best.len)) {
          var mid = (bestRun.a + bestRun.b) / 2;
          best = {
            len: bestRun.len, side: sd,
            x: horiz ? mid : (sd === 'L' ? r.x0 : r.x1),
            y: horiz ? (sd === 'T' ? r.y0 : r.y1) : mid
          };
        }
      }
      rooms[i].door = best;
    }
  })();

  /* ============================================================

  /* 每一层单独刷一套道具（钥匙上限 10 把），楼层之间互不影响 */
  function rollItems() {
    var i, idx = [], out = [];
    for (i = 0; i < rooms.length; i++) { idx.push(i); out.push({ item: 'none', taken: false }); }
    for (i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;

        if (r < 0.14) { out[k].item = 'laptop'; }

  /* 把某一层的道具装到当前房间上 */

      data[i] = { item: rooms[i].item, taken: rooms[i].taken };
    }
  }

  function spawnTraps() {
    var guard = 0;
    while (traps.length < 14 && guard++ < 800) {
      var a = areas[Math.floor(Math.random() * areas.length)];
      var r = a.p;
      var x = rnd(r.x0 + 14, r.x1 - 14), y = rnd(r.y0 + 14, r.y1 - 14);
      if (!circleOk(x, y, 10)) { continue; }
      if (dist2(x, y, player.x, player.y) < 160 * 160) { continue; }
      traps.push({ x: x, y: y, dead: false });
    }
  }

  function makeSup(points, label) {
    return {

      mode: 'patrol', wp: points, wi: 1, tgt: null,
      see: 0, lost: 0, stun: 0, sweep: 0, searchT: 0,
      face: 0, scan: 0, label: label

  function spawnSups() {

    var route = [
      { x: gx(24), y: gy(70) },
      { x: gx(112), y: gy(70) },
      { x: gx(119.5), y: gy(24) },
      { x: gx(119.5), y: gy(21.5) },
      { x: gx(119.5), y: gy(24) },
      { x: gx(119.5), y: gy(70) }
    ];
    /* 从离玩家最远的那段开始巡，避免刚下楼就撞脸（尤其是楼梯口就在巡逻线上） */

  /* ============================================================

    holdT = 0; holdId = ''; doorT = 0; doorBusy = false; doorRoom = null; fLock = false; curTarget = null; heartAcc = 0;
    player.hp = player.hpMax; player.st = player.stMax; player.keys = 0;

  /* ============================================================
     13. 玩家移动（走廊 / 房间 / 一楼共用）

  function movePlayer(dt, left, top, right, bottom, noRegen) {
    if (player.stun > 0) {
      player.stun -= dt;
      return;
    }
    var dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) { dx -= 1; }
    if (keys['d'] || keys['arrowright']) { dx += 1; }
    if (keys['w'] || keys['arrowup']) { dy -= 1; }
    if (keys['s'] || keys['arrowdown']) { dy += 1; }

    var len = Math.sqrt(dx * dx + dy * dy);
    if (len > 0) {
      dx /= len; dy /= len;
