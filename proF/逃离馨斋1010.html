    }

    var wantRun = !!(keys['shift'] && len > 0 && player.st > 1 && player.noRunT <= 0);
    var base = wantRun ? 250 : 150;

    /* 体力耗尽就疲劳减速，回到 25 点体力才恢复 */
    if (player.st <= 0) { player.tired = true; }
    else if (player.tired && player.st >= 25) { player.tired = false; }

    var mul = player.speedMul;
    if (player.tired) { mul *= 0.5; }

    var sp = base * mul;

    if (wantRun) {
      player.st -= 26 * dt;
      if (player.st <= 0) { player.st = 0; player.noRunT = 1.6; player.tired = true; }
    } else {
      /* 楼梯通道里不回体力（下楼每一步都在扣），其它地方走路慢慢回 */
      if (!noRegen) { player.st = Math.min(player.stMax, player.st + 11 * dt); }
      if (player.noRunT > 0) { player.noRunT -= dt; }
    }

    if (len > 0) {
      var nx = player.x + dx * sp * dt;
      var ny = player.y + dy * sp * dt;
      if (left !== undefined) {
        nx = clamp(nx, left + player.r, right - player.r);
        ny = clamp(ny, top + player.r, bottom - player.r);
        if (blockFn) {
          if (blockFn(nx, player.y, player.r)) { nx = player.x; }
          if (blockFn(player.x, ny, player.r)) { ny = player.y; }
        }
      } else {
        if (!circleOk(nx, player.y, player.r)) { nx = player.x; }
        if (!circleOk(player.x, ny, player.r)) { ny = player.y; }
      }
      player.x = nx; player.y = ny;

      /* 脚步声：走路 / 奔跑半径不同，脸盆让脚步声翻倍 */
      player.stepAcc += sp * dt;
      var stepGap = wantRun ? 34 : 26;
      if (player.stepAcc > stepGap) {
        player.stepAcc = 0;
        var rad = (wantRun ? 230 : 95) * player.noiseMul;
        noise(player.x, player.y, rad);
        if (wantRun) { burst(player.x, player.y + 6, 2, 'rgba(160,190,230,.5)'); }
      }
    } else {
      player.stepAcc = 0;
    }
  }

  /* ============================================================
     14. 走廊交互目标
     ============================================================ */
  function findTarget() {
    var best = null, bd = 48 * 48, i, d;

    /* 房门优先：站在宿舍门口按 F 一定是进宿舍，不会被旁边的楼梯 / 电梯抢走 */
    for (i = 0; i < rooms.length; i++) {
      var rm = rooms[i];
      if (!rm.door) { continue; }
      d = dist2(player.x, player.y, rm.door.x, rm.door.y);
      if (d < bd) {
        bd = d;
        best = { type: 'room', room: rm, x: rm.door.x, y: rm.door.y, label: 'F 进入 ' + roomLabel(rm) };
      }
    }
    if (best && bd <= 44 * 44) { return best; }

    for (i = 0; i < facs.length; i++) {
      var f = facs[i];
      if (f.t !== 'stairs' && f.t !== 'elev' && f.t !== 'exit') { continue; }
      var pad = (f.t === 'exit') ? 16 : 10;
      if (player.x > f.p.x0 - pad && player.x < f.p.x1 + pad &&
          player.y > f.p.y0 - pad && player.y < f.p.y1 + pad) {
        /* 站进设施范围里就算贴身（电梯间这种大房间，别拿中心点算距离） */
        d = 0;
        if (d < bd) {
          bd = d;
          var label = 'F 长按 1 秒 · 下楼';
          if (f.t === 'elev') { label = 'F 长按 3 秒 · 电梯'; }
          if (f.t === 'exit') { label = 'F 安全出口'; }
          best = { type: f.t, x: f.cx, y: f.cy, id: 'fac' + i, label: label };
        }
      }
    }
    return best;
  }

  /* ============================================================
     15. 场景切换：宿舍 / 一楼
     ============================================================ */
  function enterRoom(rm) {
    scene = 'room';
    roomSc = {
      room: rm, box: ROOM_BOX,
      taken: !!rm.taken, dwell: 0,          /* 道具是否已被拿走，跟着房间本身走 */
      checking: false, arrived: false, scanT: 0, checkCd: 3,
      backX: player.x, backY: player.y, door: { x: ROOM_DOOR.x, y: ROOM_DOOR.y }
    };
    blockFn = roomBlocked;
    player.x = ROOM_DOOR.x; player.y = ROOM_DOOR.y - 34;
    player.stun = 0;
    holdT = 0; holdId = ''; doorT = 0; doorBusy = false; doorRoom = null; fLock = false; curTarget = null;
    banner(roomLabel(rm) + ' 室', 1000);
  }

  /* 宿舍里的家具碰撞（上下铺 / 桌子 / 柜子） */
  function roomBlocked(x, y, r) {
    for (var i = 0; i < FURN.length; i++) {
      var b = FURN[i];
      if (x > b.x0 - r && x < b.x1 + r && y > b.y0 - r && y < b.y1 + r) { return true; }
    }
    return false;
  }

  /* 门外的走廊落点：沿门的朝向把玩家推出墙外，避免卡在墙里 */
  function doorOutside(rm) {
    var d = rm && rm.door;
    if (!d) { return null; }
    var k = 20, ox = 0, oy = 0;
    if (d.side === 'T') { oy = -k; }
    else if (d.side === 'B') { oy = k; }
    else if (d.side === 'L') { ox = -k; }
    else { ox = k; }
    return { x: d.x + ox, y: d.y + oy };
  }

  /* 从门口退回走廊 */
  function leaveRoom() {
    if (!roomSc) { return; }
    var p = doorOutside(roomSc.room);
    if (p) { player.x = p.x; player.y = p.y; }
    else { player.x = roomSc.backX; player.y = roomSc.backY; }
    scene = 'corridor';
    roomSc = null;
    blockFn = null;
    releaseCheck();
    player.inv = Math.max(player.inv, 0.6);
  }

  function enterLobby(viaStairs) {
    scene = 'lobby';
    blockFn = lobbyBlocked;
    releaseCheck();
    lobbySc = {
      box: { x0: 230, y0: 120, x1: 670, y1: 470 },
      gate: { x0: 410, y0: 120, x1: 490, y1: 120 },
      viaStairs: !!viaStairs, stepAcc: 0,
      back: null,                      /* 楼梯口：走楼梯下来才有，可以原路回一楼走廊 */
      guard: { x: 285, y: 205, r: 11, ang: 0, mode: 'home', t: 0, wait: 6 + Math.random() * 5, stun: 0 }
    };
    player.x = 450; player.y = 440;
    player.stun = 0;
    player.inv = Math.max(player.inv, 0.8);
    holdT = 0; holdId = ''; doorT = 0; doorBusy = false; doorRoom = null; fLock = false;
    elFloor.textContent = '1F';
    banner(viaStairs ? '摸黑下楼，左下角有楼梯口' : '电梯直达一楼 · 值班室里有宿管', 1700);
  }

  /* 一楼门禁场景里的障碍：左侧值班室（宿管房间）的墙 */
  var LOBBY_GUARDROOM = { x0: 240, y0: 150, x1: 340, y1: 270 };
  function lobbyBlocked(x, y, r) {
    var g = LOBBY_GUARDROOM;
    return x > g.x0 - r && x < g.x1 + r && y > g.y0 - r && y < g.y1 + r;
  }

  function useStairs() {
    /* 楼梯：手里所有钥匙一次性换成楼层 —— 有几把就下几层，最多下到 1 楼 */
    if (floor <= 1) {
      /* 已经在一楼：楼梯口直接通门禁大厅（不再扣钥匙） */
      tone(300, 0.2, 0.1, 'sine', 180);
      var bx = player.x, by = player.y;
      enterLobby(true);
      lobbySc.back = { x: bx, y: by };
      return;
    }
    if (player.keys < 1) {
      banner('下楼梯要一把钥匙', 1500);
      sfxDeny();
      return;
    }
    /* 边界：最多一次下到 1 楼。钥匙比楼层多时，多出来的留着，不会白扣 */
    var n = Math.min(player.keys, floor - 1);
    player.keys -= n;
    updateHUD();
    for (var i = 0; i < n; i++) { descend(true); }
    tone(300, 0.22, 0.1, 'sine', 180);
    banner(n > 1 ? ('一口气下了 ' + n + ' 层 · ' + (floor === 1 ? '到一楼了' : '到 ' + floor + ' 层'))
                 : (floor === 1 ? '到一楼了 · 从楼梯口出去就是门禁' : floor + ' 层 · 楼梯口'), 1700);
  }

  /* 下一层：房间号换前缀、道具换一套、楼梯消耗体力，落到新的一层楼梯口
     quiet = true 时不自己播音效/横幅（连续下多层时由 useStairs 统一播一次） */
  function descend(quiet) {
    saveFloorItems(floor);
    floor--;
    loadFloorItems(floor);
    traps.length = 0;
    sups.length = 0;
    spawnTraps();
    spawnSups();

    scene = 'corridor';
    roomSc = null; lobbySc = null; blockFn = null;
    releaseCheck();
    holdT = 0; holdId = ''; doorT = 0; doorBusy = false; doorRoom = null; fLock = false; curTarget = null;

    elFloor.textContent = floor + 'F';
    /* 楼梯消耗体力，到新的一层后再慢慢恢复 */
    player.st = Math.max(0, player.st - 30);
    player.tired = player.st <= 0;
    player.inv = Math.max(player.inv, 2.5);
    camX = player.x; camY = player.y;
    fade = 1;                       /* 下楼的闪黑特效 */

    if (!quiet) {
      tone(300, 0.22, 0.1, 'sine', 180);
      banner(floor === 1 ? '到一楼了 · 从楼梯口出去就是门禁' : floor + ' 层 · 楼梯口', 1700);
    }
  }

  /* 从一楼大厅的楼梯口回一楼走廊 */
  function goBackUp() {
    if (!lobbySc || !lobbySc.back) { return; }
    player.x = lobbySc.back.x;
    player.y = lobbySc.back.y;
    scene = 'corridor';
    lobbySc = null;
    blockFn = null;
    holdT = 0; holdId = ''; doorT = 0; doorBusy = false; doorRoom = null; fLock = false; curTarget = null;
    elFloor.textContent = floor + 'F';
    player.inv = Math.max(player.inv, 1.2);
    tone(320, 0.18, 0.1, 'sine', 220);
    banner(floor + ' 层 · 楼梯口', 1200);
  }

  function useElev() {
    if (player.keys < NEED_ELEV) {
      holdT = 0; holdId = ''; doorT = 0; doorBusy = false; doorRoom = null; fLock = false;
      banner('电梯要收一把钥匙：需要 4 把', 1600);
      sfxDeny();
      return false;
    }
    player.keys--;
    updateHUD();
    tone(420, 0.35, 0.14, 'square', 700);
    enterLobby(false);
    return true;
  }

  /* ============================================================
     16. 宿管 AI
     ============================================================ */
  function supSees(s) {
    if (scene === 'room') { return false; }      /* 玩家在屋里，宿管看不见 */
    var d = Math.sqrt(dist2(s.x, s.y, player.x, player.y));
    if (d > 250 || d < 1) { return false; }
    var ang = Math.atan2(player.y - s.y, player.x - s.x);
    var diff = Math.abs(((ang - s.ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    if (diff > 0.58) { return false; }          /* 手电筒扇形 ±33° */
    return losClear(s.x, s.y, player.x, player.y);
  }

  function stepToward(e, tx, ty, sp, dt) {
    var dx = tx - e.x, dy = ty - e.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 2) { return true; }
    var base = Math.atan2(dy, dx);
    var tries = [0, 0.45, -0.45, 0.95, -0.95, 1.5, -1.5];
    for (var i = 0; i < tries.length; i++) {
      var a = base + tries[i];
      var nx = e.x + Math.cos(a) * sp * dt;
      var ny = e.y + Math.sin(a) * sp * dt;
      if (circleOk(nx, ny, e.r)) {
        e.x = nx; e.y = ny; e.ang = a;
        return false;
      }
    }
    e.ang = base;
    return false;
  }

  /* 被宿管撞开：只往能站的地方推，绝不把人顶进墙里 */
  function knockBack(s) {
    var ax = s.x - player.x, ay = s.y - player.y;
    var al = Math.sqrt(ax * ax + ay * ay) || 1;
    var ux = -ax / al, uy = -ay / al;
    var steps = [30, 24, 18, 12, 6];
    for (var i = 0; i < steps.length; i++) {
      var nx = player.x + ux * steps[i];
      var ny = player.y + uy * steps[i];
      if (circleOk(nx, ny, player.r)) { player.x = nx; player.y = ny; return; }
    }
    /* 四面都推不动就原地不动，总比卡在墙里好 */
  }

  /* 兜底：万一玩家被挤进了不可行走的地方，就近拉回能站的位置 */
  function rescuePlayer() {
    if (circleOk(player.x, player.y, player.r)) { return; }
    for (var rad = 10; rad <= 260; rad += 10) {
      for (var i = 0; i < 16; i++) {
        var a = i * Math.PI * 2 / 16;
        var nx = player.x + Math.cos(a) * rad;
        var ny = player.y + Math.sin(a) * rad;
        if (circleOk(nx, ny, player.r)) { player.x = nx; player.y = ny; return; }
      }
    }
  }

  function updateSup(s, dt) {
    if (s.stun > 0) { s.stun -= dt; return; }

    /* 玩家躲进宿舍：正在追的宿管跟丢，回到巡逻 */
    if (scene === 'room' && s.mode !== 'check') {
      s.mode = 'patrol'; s.tgt = null; s.see = 0; s.lost = 0;
    }

    /* 查寝：走到宿舍门口站定，把手电对着门内扫 */
    if (s.mode === 'check' && s.tgt) {
      var at = stepToward(s, s.tgt.x, s.tgt.y, 128, dt);
      if (at) {
        s.scan += dt;
        s.ang = s.face + Math.sin(s.scan * 2.0) * 0.8;
      } else {
        s.ang = Math.atan2(s.tgt.y - s.y, s.tgt.x - s.x);
      }
      return;
    }

    if (supSees(s)) {
      s.see += dt; s.lost = 0;
      s.tgt = { x: player.x, y: player.y };
      s.mode = 'chase';
    } else if (s.see > 0) {
      s.lost += dt;
      if (s.lost > 2.2) { s.see = 0; s.mode = s.tgt ? 'search' : 'patrol'; s.searchT = 0; }
    }

    var sp = 0;
    if (s.mode === 'chase' && s.tgt) {
      sp = 162;
      stepToward(s, s.tgt.x, s.tgt.y, sp, dt);
      /* 贴身抓人也要看得见：躲在墙后面就不会被抓（之前隔着墙也能打到） */
      if (dist2(s.x, s.y, player.x, player.y) < 26 * 26 &&
          losClear(s.x, s.y, player.x, player.y)) {
        hitPlayer(34);
        s.stun = 0.9;
        knockBack(s);
      }
      return;
    }

    if (s.mode === 'search' && s.tgt) {
      var arrived = stepToward(s, s.tgt.x, s.tgt.y, 118, dt);
      if (arrived) {
        s.searchT += dt;
        s.ang += dt * 2.6;                   /* 原地扫视 */
        if (s.searchT > 2.4) { s.mode = 'patrol'; s.tgt = null; s.searchT = 0; }
      }
      return;
    }

    /* 巡逻：在固定路线之间走 */
    if (!s.wp || s.wp.length < 2) { return; }
    var target = s.wp[s.wi];
    if (stepToward(s, target.x, target.y, 82, dt)) {
      s.wi = (s.wi + 1) % s.wp.length;
    }
  }

  /* ============================================================
     17. 更新：走廊
     ============================================================ */
  function updateParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.t += dt;
      if (p.t >= p.life) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
    }
  }

  function followCam(dt) {
    var k = Math.min(1, dt * 9);
    camX += (player.x - camX) * k;
    camY += (player.y - camY) * k;
    var halfW = W / 2, halfH = H / 2;
    var wx0 = worldRect.x0, wx1 = worldRect.x1, wy0 = worldRect.y0, wy1 = worldRect.y1;
    camX = (wx1 - wx0 <= W) ? (wx0 + wx1) / 2 : clamp(camX, wx0 + halfW, wx1 - halfW);
    camY = (wy1 - wy0 <= H) ? (wy0 + wy1) / 2 : clamp(camY, wy0 + halfH, wy1 - halfH);
  }

  function updateCorridor(dt) {
    /* 推门读条期间锁住移动（计时在下面的交互块里，别在这儿重复累加）。
       但眩晕时必须放行 movePlayer：眩晕计时就是在它里面递减的，
       否则"踩着袜子还能稳站门口"时眩晕会被冻住，读条走完人也照样站着。 */
    if (player.stun > 0) {
      doorT = 0; doorBusy = false; doorRoom = null;
    }
    if (!doorBusy) { movePlayer(dt); }
    rescuePlayer();          /* 兜底：被挤进不可走区域就拉回来 */
    updateParts(dt);

    /* 臭袜子：踩上去眩晕 2 秒并发出惨叫 */
    if (player.stun <= 0) {
      for (var i = 0; i < traps.length; i++) {
        var tr = traps[i];
        if (tr.dead) { continue; }
        if (dist2(player.x, player.y, tr.x, tr.y) < (player.r + 8) * (player.r + 8)) {
          tr.dead = true;
          player.stun = 2;
          player.st = Math.max(0, player.st - 6);
          shake = 10; flash = 0.45; flashCol = '255,209,102';
          banner('踩到臭袜子，惨叫引来了宿管', 1500);
          sfxScream();
          noise(player.x, player.y, 620);
          burst(tr.x, tr.y, 10, '#8a7a4a');
          break;
        }
      }
    }

    /* 交互：进宿舍要按住 F 在原地推门 0.5 秒，一松开就归零重来。
       眩晕期间（踩到臭袜子）不给提示、也不许读条：curTarget 直接置空，
       下面的推门 / 长按整段被挡掉，doorT、holdT 同时归零。 */
    curTarget = player.stun > 0 ? null : findTarget();
    if (!keys['f']) { fLock = false; }
    if (curTarget && curTarget.type === 'room' && keys['f'] && !fLock) {
      if (doorRoom !== curTarget.room) { doorT = 0; doorRoom = curTarget.room; }
      doorBusy = true;
      doorT += dt;
      if (doorT >= DOOR_TIME) {
        var intoRoom = doorRoom;
        doorT = 0; doorBusy = false; doorRoom = null;
        if (intoRoom) { enterRoom(intoRoom); fLock = true; return; }
      }
    } else {
      doorT = 0; doorBusy = false; doorRoom = null;
      if (curTarget && fEdge && curTarget.type === 'exit') {
        fEdge = false;
        banner('安全出口被链锁锁死了', 1400);
        sfxDeny();
      }
    }

    /* 长按读条：电梯 3 秒（读条期间全图噪音）、楼梯 1 秒。松开或走开都归零 */
    if (doorBusy) {
      /* 推门读条期间不碰长按那条逻辑 */
    } else if (!fLock && curTarget && (curTarget.type === 'elev' || curTarget.type === 'stairs')) {
      if (keys['f']) {
        if (holdId !== curTarget.id) { holdId = curTarget.id; holdT = 0; }
        holdT += dt;
        if (curTarget.type === 'elev') { noise(player.x, player.y, 99999, true); }
        if (holdT >= holdNeedOf(curTarget.type)) {
          holdT = 0; holdId = '';
          if (curTarget.type === 'stairs') { useStairs(); } else { useElev(); }
          fLock = true;
          return;
        }
      } else { holdT = 0; holdId = ''; }
    } else {
      holdT = 0; holdId = '';
    }

    for (i = 0; i < sups.length; i++) { updateSup(sups[i], dt); }

    followCam(dt);
    fEdge = false;
  }

  /* ============================================================
     18. 更新：宿舍内部（独立状态机）
     ============================================================ */
  function updateRoom(dt) {
    var box = roomSc.box;
    if (!doorBusy) { movePlayer(dt, box.x0, box.y0, box.x1, box.y1); }
    updateParts(dt);

    roomSc.dwell += dt;
    if (roomSc.checkCd > 0) { roomSc.checkCd -= dt; }

    /* 玩家在屋里时，宿管照样在走廊巡逻，但看不见你 */
    for (var i = 0; i < sups.length; i++) { updateSup(sups[i], dt); }

    /* 待太久，把走廊里最近的宿管引到门口来查寝；附近没宿管就什么也不会发生 */
    if (!roomSc.checking && roomSc.checkCd <= 0 && roomSc.dwell > CHECK_AFTER) {
      var out = doorOutside(roomSc.room);
      var s = nearestSupTo(out.x, out.y, 1100);
      if (s) {
        s.mode = 'check';
        s.tgt = { x: out.x, y: out.y };
        s.scan = 0;
        s.face = Math.atan2(roomSc.room.door.y - out.y, roomSc.room.door.x - out.x);
        roomSc.checking = true;
        roomSc.arrived = false;
        roomSc.scanT = 0;
        banner('走廊里传来脚步声，有人往这间宿舍来了', 1700);
        tone(150, 0.4, 0.13, 'sine', 92);
      } else {
        roomSc.dwell = 0;
      }
    }

    /* 宿管到门口才开始扫视；被光扫到只掉血，不会被赶出房间 */
    if (roomSc.checking) {
      var cs = null;
      for (i = 0; i < sups.length; i++) {
        if (sups[i].mode === 'check') { cs = sups[i]; break; }
      }
      if (!cs) {
        roomSc.checking = false;
        roomSc.checkCd = CHECK_CD;
        roomSc.dwell = 0;
      } else {
        var out2 = doorOutside(roomSc.room);
        if (!roomSc.arrived && dist2(cs.x, cs.y, out2.x, out2.y) < 36 * 36) {
          roomSc.arrived = true;
          roomSc.scanT = 0;
          roomSc.scanHit = false;
          banner('宿管推开门，用手电扫视这间宿舍', 1500);
          tone(300, 0.18, 0.12, 'square', 170);
        }
        if (roomSc.arrived) {
          roomSc.scanT += dt;
          /* 一次查寝最多被扫到一次；站到光柱扫不到的角落就安全 */
          if (!roomSc.scanHit && player.inv <= 0 && inBeam(player.x, player.y, beamAngle(roomSc.scanT))) {
            roomSc.scanHit = true;
            banner('被手电扫到了', 1200);
            hitPlayer(22);
            if (state !== 'playing') { return; }
          }
          if (roomSc.scanT > CHECK_SCAN) {
            roomSc.checking = false;
            roomSc.arrived = false;
            roomSc.checkCd = CHECK_CD;
            roomSc.dwell = 0;
            releaseCheck();
            banner('脚步走远了', 1200);
          }
        }
      }
    }

    /* 房间里踩到臭袜子：直接触发，不用按 F */
    var it = roomSc.room.item;
    if (it === 'sock' && !roomSc.taken && player.stun <= 0 &&
        dist2(player.x, player.y, ROOM_ITEM.x, ROOM_ITEM.y) < (player.r + 9) * (player.r + 9)) {
      roomSc.taken = true;
      roomSc.room.taken = true;
      player.stun = 2;
      shake = 9; flash = 0.4; flashCol = '255,209,102';
      banner('踩到臭袜子，惨叫引来了宿管', 1600);
      sfxScream();
      noise(player.x, player.y, 700);
      burst(ROOM_ITEM.x, ROOM_ITEM.y, 10, '#8a7a4a');
    }

    /* 房间里的道具（臭袜子是地雷，不能拾取） */
    var nearItem = it && it !== 'none' && it !== 'sock' && !roomSc.taken &&
      dist2(player.x, player.y, ROOM_ITEM.x, ROOM_ITEM.y) < 52 * 52;
    var nearDoor = dist2(player.x, player.y, ROOM_DOOR.x, ROOM_DOOR.y) < 46 * 46;

    curTarget = null;
    if (nearItem) {
      curTarget = { type: 'item', label: 'F 拾取' + itemName(it) };
    } else if (nearDoor) {
      curTarget = { type: 'leave', label: 'F 返回走廊' };
    }

    /* 出门同样要按住 F 推门 0.5 秒，松开就归零 */
    if (!keys['f']) { fLock = false; }
    if (curTarget && curTarget.type === 'leave' && keys['f'] && !fLock) {
      doorBusy = true;
      doorT += dt;
      if (doorT >= DOOR_TIME) {
        doorT = 0; doorBusy = false; doorRoom = null;
        leaveRoom();
        fLock = true;
        return;
      }
    } else {
      doorT = 0; doorBusy = false; doorRoom = null;
      if (fEdge && curTarget && curTarget.type === 'item') { fEdge = false; takeItem(it); }
    }
    fEdge = false;
  }

  function itemName(t) {
    if (t === 'key') { return '钥匙'; }
    if (t === 'laptop') { return '笔记本电脑'; }
    if (t === 'basin') { return '脸盆'; }
    if (t === 'sock') { return '臭袜子'; }
    return '道具';
  }

  function takeItem(t) {
    var rm = roomSc.room;
    roomSc.taken = true;
    rm.taken = true;
    sfxPick();
    burst(ROOM_ITEM.x, ROOM_ITEM.y, 12, '#ffd166');

    if (t === 'key') {
      player.keys++;
      banner('拿到钥匙 · 手里 ' + player.keys + ' 把', 1200);
    } else if (t === 'laptop') {
      player.speedMul *= 0.6;
      player.shield++;
      banner('笔记本：移速 -40%，可挡一次攻击', 1800);
    } else if (t === 'basin') {
      player.defMul = 0.5;
      player.noiseMul *= 2;
      banner('脸盆：伤害减半，脚步声翻倍', 1800);
    }
    updateHUD();
  }

  /* ============================================================
     19. 更新：一楼（门禁）
     ============================================================ */
  function updateLobby(dt) {
    var box = lobbySc.box;
    var beforeX = player.x, beforeY = player.y;
    movePlayer(dt, box.x0, box.y0, box.x1, box.y1, lobbySc.viaStairs);
    updateParts(dt);

    /* 走楼梯下来：极暗 + 每走一步扣 1 点体力 */
    if (lobbySc.viaStairs) {
      var moved = Math.sqrt(dist2(player.x, player.y, beforeX, beforeY));
      lobbySc.stepAcc += moved;
      while (lobbySc.stepAcc > 14) {
        lobbySc.stepAcc -= 14;
        player.st = Math.max(0, player.st - 1);
      }
    }

    var nearGate = dist2(player.x, player.y, 450, box.y0 + 10) < 52 * 52;
    var nearBack = !!(lobbySc.back &&
      dist2(player.x, player.y, LOBBY_BACK.x, LOBBY_BACK.y) < 46 * 46);

    if (nearBack) { curTarget = { type: 'back', label: 'F 从楼梯回走廊' }; }
    else if (nearGate) { curTarget = { type: 'gate', label: 'F 长按 5 秒开门禁' }; }
    else { curTarget = null; }

    /* 楼梯口：原路返回一楼走廊 */
    if (nearBack && fEdge) { fEdge = false; goBackUp(); return; }

    /* 门禁旁的值班室：宿管随机出来抓人 */
    updateLobbyGuard(dt, box);

    if (nearGate && keys['f']) {
      if (player.keys < NEED_KEY) {
        if (!lobbySc.denied) {
          lobbySc.denied = true;
          banner('门禁需要 3 把钥匙', 1600);
          sfxDeny();
        }
        holdT = 0; holdId = '';
      } else {
        lobbySc.denied = false;
        holdId = 'gate';
        holdT += dt;
        if (holdT >= HOLD_GATE) { holdT = 0; holdId = ''; win(); return; }
      }
    } else {
      lobbySc.denied = false;
      holdT = 0; holdId = '';
    }

    fEdge = false;
  }

  /* 一楼门禁场景里，把玩家往某个方向推开一点（不推进值班室墙里） */
  function knockInLobby(sx, sy, box) {
    var ax = sx - player.x, ay = sy - player.y;
    var al = Math.sqrt(ax * ax + ay * ay) || 1;
    var ux = -ax / al, uy = -ay / al;
    var steps = [30, 21, 12];
    for (var i = 0; i < steps.length; i++) {
      var nx = clamp(player.x + ux * steps[i], box.x0 + player.r, box.x1 - player.r);
      var ny = clamp(player.y + uy * steps[i], box.y0 + player.r, box.y1 - player.r);
      if (!lobbyBlocked(nx, ny, player.r)) { player.x = nx; player.y = ny; return; }
    }
  }

  /* 值班室宿管：待一会儿 → 随机出来追人 → 回房间 */
  function updateLobbyGuard(dt, box) {
    var g = lobbySc.guard;
    if (!g) { return; }
    var home = { x: (LOBBY_GUARDROOM.x0 + LOBBY_GUARDROOM.x1) / 2,
                 y: (LOBBY_GUARDROOM.y0 + LOBBY_GUARDROOM.y1) / 2 };

    if (g.stun > 0) { g.stun -= dt; return; }

    if (g.mode === 'home') {
      g.x = home.x; g.y = home.y;
      g.wait -= dt;
      if (g.wait <= 0) {
        g.mode = 'out'; g.t = 0;
        banner('值班室的宿管出来了', 1400);
        tone(180, 0.26, 0.16, 'sawtooth', 90);
      }
      return;
    }

    if (g.mode === 'out') {
      g.t += dt;
      var dx = player.x - g.x, dy = player.y - g.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var spd = 118;
      g.x += dx / d * spd * dt;
      g.y += dy / d * spd * dt;
      g.ang = Math.atan2(dy, dx);
      g.x = clamp(g.x, box.x0 + 12, box.x1 - 12);
      g.y = clamp(g.y, box.y0 + 12, box.y1 - 12);
      if (dist2(g.x, g.y, player.x, player.y) < 26 * 26) {
        hitPlayer(34);
        g.stun = 0.85;
        knockInLobby(g.x, g.y, box);
        return;
      }
      if (g.t > 6) { g.mode = 'back'; }
      return;
    }

    /* back：回值班室 */
    var bx = home.x - g.x, by = home.y - g.y;
    var bd = Math.sqrt(bx * bx + by * by);
    if (bd < 12) {
      g.mode = 'home';
      g.wait = 8 + Math.random() * 6;     /* 回屋后留出一段安静时间，够玩家按完门禁 */
      return;
    }
    g.x += bx / bd * 100 * dt;
    g.y += by / bd * 100 * dt;
    g.ang = Math.atan2(by, bx);
  }

  /* ============================================================
     20. 心跳音效（宿管越近越快）
     ============================================================ */
  function updateHeart(dt) {
    var d = 9999;
    for (var i = 0; i < sups.length; i++) {
      var dd = Math.sqrt(dist2(sups[i].x, sups[i].y, player.x, player.y));
      if (dd < d) { d = dd; }
    }
    if (scene !== 'corridor') { d = 9999; }

    var bps;                                   /* 每秒心跳次数 */
    if (d < 200) { bps = 2.0; }
    else if (d < 380) { bps = 1.45; }
    else if (d < 700) { bps = 0.95; }
    else { bps = 0.6; }
    for (var k = 0; k < sups.length; k++) {
      if (sups[k].mode === 'chase') { bps = 2.4; break; }
    }

    heartAcc -= dt;
    if (heartAcc <= 0) {
      heartAcc = 1 / bps;
      tone(56, 0.16, 0.28, 'sine', 38);
    }
  }

  /* ============================================================
     21. 主更新入口
     ============================================================ */
  function update(dt) {
    playTime += dt;
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) { elBanner.classList.remove('show'); } }
    if (shake > 0) { shake *= Math.pow(0.02, dt); if (shake < 0.3) { shake = 0; } }
    if (flash > 0) { flash -= dt * 1.8; if (flash < 0) { flash = 0; } }
    if (fade > 0) { fade -= dt * 2.4; if (fade < 0) { fade = 0; } }
    if (player.inv > 0) { player.inv -= dt; }

    if (scene === 'corridor') { updateCorridor(dt); }
    else if (scene === 'room' && roomSc) { updateRoom(dt); }
    else if (scene === 'lobby' && lobbySc) { updateLobby(dt); }

    updateHeart(dt);
    updateHUD();
  }

  /* ============================================================
     22. 绘制工具
     ============================================================ */
  function fog(px, py, radius) {
    var g = ctx.createRadialGradient(px, py, radius * 0.52, px, py, radius);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.62, 'rgba(0,0,0,.28)');
    g.addColorStop(1, 'rgba(2,4,9,1)');
    ctx.beginPath();
    ctx.arc(px, py, radius, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    /* 圆之外的区域：纯黑 */
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(px, py, radius, 0, Math.PI * 2);
    ctx.fillStyle = '#02040a';
    ctx.fill('evenodd');
  }

  function screenFX() {
    if (fade > 0.01) {
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, fade).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    if (flash > 0.01) {
      ctx.fillStyle = 'rgba(' + flashCol + ',' + (flash * 0.5).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    /* 受伤 / 心跳边缘压暗 */
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(80,0,10,.28)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  function wallSegs(side, r, opens) {
    var e0, e1, segs = [], i;
    if (side === 'T' || side === 'B') { e0 = r.x0; e1 = r.x1; }
    else { e0 = r.y0; e1 = r.y1; }
    var list = [];
    for (i = 0; i < opens.length; i++) { if (opens[i].s === side) { list.push(opens[i]); } }
    list.sort(function (p, q) { return p.p0 - q.p0; });
    var cur = e0;
    for (i = 0; i < list.length; i++) {
      var o = list[i];
      if (o.p0 > cur) { segs.push([cur, Math.min(o.p0, e1)]); }
      cur = Math.max(cur, o.p1);
    }
    if (cur < e1) { segs.push([cur, e1]); }
    return segs;
  }

  function drawRoomBlock(rm) {
    var r = rm.r;
    ctx.fillStyle = '#070c15';
    ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    ctx.strokeStyle = 'rgba(58,76,105,.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x0 + 1, r.y0 + 1, r.x1 - r.x0 - 2, r.y1 - r.y0 - 2);

    ctx.fillStyle = 'rgba(120,150,190,.62)';
    ctx.font = '700 10px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(roomLabel(rm), rm.cx, rm.cy);
  }

  function drawArea(a) {
    var r = a.p;
    var col = '#101725';
    if (a.kind === 'stairs') { col = '#151d2b'; }
    if (a.kind === 'elev') { col = '#1a2231'; }
    if (a.kind === 'wc') { col = '#0e1520'; }

    ctx.fillStyle = col;
    ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);

    /* 地砖 */
    ctx.save();
    ctx.beginPath();
    ctx.rect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    ctx.clip();
    ctx.strokeStyle = 'rgba(90,130,180,.07)';
    ctx.lineWidth = 1;
    var x, y;
    for (x = Math.ceil(Math.max(r.x0, camL) / 32) * 32; x < Math.min(r.x1, camR); x += 32) {
      ctx.beginPath(); ctx.moveTo(x, r.y0); ctx.lineTo(x, r.y1); ctx.stroke();
    }
    for (y = Math.ceil(Math.max(r.y0, camT) / 32) * 32; y < Math.min(r.y1, camB); y += 32) {
      ctx.beginPath(); ctx.moveTo(r.x0, y); ctx.lineTo(r.x1, y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawWalls(a) {
    var r = a.p, sides = ['T', 'B', 'L', 'R'], i, j, segs;
    for (i = 0; i < 4; i++) {
      segs = wallSegs(sides[i], r, a.opens);
      for (j = 0; j < segs.length; j++) {
        var s0 = segs[j][0], s1 = segs[j][1];
        if (s1 - s0 < 2) { continue; }
        ctx.lineWidth = 7;
        ctx.strokeStyle = '#1b2536';
        ctx.beginPath();
        if (sides[i] === 'T') { ctx.moveTo(s0, r.y0); ctx.lineTo(s1, r.y0); }
        else if (sides[i] === 'B') { ctx.moveTo(s0, r.y1); ctx.lineTo(s1, r.y1); }
        else if (sides[i] === 'L') { ctx.moveTo(r.x0, s0); ctx.lineTo(r.x0, s1); }
        else { ctx.moveTo(r.x1, s0); ctx.lineTo(r.x1, s1); }
        ctx.stroke();

        ctx.lineWidth = 1.6;
        ctx.strokeStyle = 'rgba(79,156,249,.16)';
        ctx.stroke();
      }
    }
  }

  /* 明显一点的门：门口一条亮黄门槛 + 两侧门框柱 */
  function drawDoorMarks(a) {
    if (!a.doorGlow) { return; }
    var r = a.p, i, o, x0, y0, x1, y1, horiz, t = 10;
    for (i = 0; i < a.opens.length; i++) {
      o = a.opens[i];
      horiz = (o.s === 'T' || o.s === 'B');
      if (o.s === 'T') { x0 = o.p0; x1 = o.p1; y0 = y1 = r.y0; }
      else if (o.s === 'B') { x0 = o.p0; x1 = o.p1; y0 = y1 = r.y1; }
      else if (o.s === 'L') { y0 = o.p0; y1 = o.p1; x0 = x1 = r.x0; }
      else { y0 = o.p0; y1 = o.p1; x0 = x1 = r.x1; }

      /* 门槛：一条暗一点的门线铺在门洞里 */
      ctx.strokeStyle = 'rgba(255,209,102,.38)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();

      /* 门框：两端各一道短线，把门洞框出来 */
      ctx.strokeStyle = 'rgba(255,236,179,.32)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (horiz) {
        ctx.moveTo(x0, y0 - t); ctx.lineTo(x0, y0 + t);
        ctx.moveTo(x1, y1 - t); ctx.lineTo(x1, y1 + t);
      } else {
        ctx.moveTo(x0 - t, y0); ctx.lineTo(x0 + t, y0);
        ctx.moveTo(x1 - t, y1); ctx.lineTo(x1 + t, y1);
      }
      ctx.stroke();
    }
  }

  /* 电梯间：每个房间里靠下摆两部电梯 */
  function drawElevRoom() {
    for (var ei = 0; ei < elevRects.length; ei++) {
      drawOneElev(elevRects[ei]);
      drawElevExitSign(elevRects[ei]);
    }
  }

  /* 电梯间正上方挂一块「安全出口」牌子（楼梯就挂在这儿，不另外画楼梯格） */
  function drawElevExitSign(r) {
    var cx = (r.x0 + r.x1) / 2, w = 74, h = 15;
    var x = cx - w / 2, y = r.y0 + 4;
    ctx.fillStyle = 'rgba(32,120,80,.95)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(216,255,233,.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.fillStyle = '#d8ffe9';
    ctx.font = '700 10px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('安全出口', cx, y + h / 2 + 0.5);
  }

  function drawOneElev(r) {
    if (!r) { return; }
    var w = r.x1 - r.x0, h = r.y1 - r.y0;

    /* 房间轮廓 */
    ctx.strokeStyle = 'rgba(120,150,190,.45)';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x0 + 3, r.y0 + 3, w - 6, h - 6);

    if (r.quad) {
      /* 四部电梯：左右墙各两部（竖着装，门朝房间里面） */
      var vgap = 10;
      var vh = Math.min(44, (h - 30) / 2 - vgap / 2);
      var vy = r.y0 + (h - (vh * 2 + vgap)) / 2;
      for (var s = 0; s < 2; s++) {
        var vx = (s === 0) ? r.x0 + 8 : r.x1 - 8 - 22;
        for (var k = 0; k < 2; k++) {
          var yy = vy + k * (vh + vgap);
          ctx.fillStyle = '#202a3c';
          ctx.fillRect(vx, yy, 22, vh);
          ctx.strokeStyle = 'rgba(255,209,102,.7)';
          ctx.lineWidth = 2;
          ctx.strokeRect(vx + 1, yy + 1, 20, vh - 2);
          /* 电梯门缝 */
          ctx.beginPath();
          ctx.moveTo(vx + 6, yy + vh / 2);
          ctx.lineTo(vx + 16, yy + vh / 2);
          ctx.stroke();
        }
      }
    } else {
      /* 两部电梯门，并排在房间下方 */
      var gap = 8, pad = 10;
      var dw = (w - pad * 2 - gap) / 2;
      var dh = Math.min(46, h * 0.28);
      var dy = r.y1 - dh - 10;
      for (var i = 0; i < 2; i++) {
        var dx = r.x0 + pad + i * (dw + gap);
        ctx.fillStyle = '#202a3c';
        ctx.fillRect(dx, dy, dw, dh);
        ctx.strokeStyle = 'rgba(255,209,102,.7)';
        ctx.lineWidth = 2;
        ctx.strokeRect(dx + 1, dy + 1, dw - 2, dh - 2);
        /* 电梯门缝 */
        ctx.beginPath();
        ctx.moveTo(dx + dw / 2, dy + 5);
        ctx.lineTo(dx + dw / 2, dy + dh - 5);
        ctx.stroke();
      }
    }

    ctx.fillStyle = 'rgba(190,215,245,.8)';
    ctx.font = '700 11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('电梯间', (r.x0 + r.x1) / 2, r.y0 + 30);
  }

  /* 楼梯门（安全出口）：三处同样样式，和电梯间同等大小的凹间 */
  function drawStairNiche() {
    for (var si = 0; si < stairRects.length; si++) { drawOneStair(stairRects[si]); }
  }

  function drawOneStair(r) {
    if (!r) { return; }
    var w = r.x1 - r.x0, h = r.y1 - r.y0;

    ctx.fillStyle = '#151d2b';
    ctx.fillRect(r.x0 + 2, r.y0 + 2, w - 4, h - 4);

    /* 安全出口牌 */
    ctx.fillStyle = 'rgba(32,120,80,.95)';
    ctx.fillRect(r.x0 + 6, r.y0 + 5, Math.min(w - 12, 74), 15);
    ctx.fillStyle = '#d8ffe9';
    ctx.font = '700 10px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('安全出口', r.x0 + 6 + Math.min(w - 12, 74) / 2, r.y0 + 12.5);

    /* 楼梯行 */
    ctx.fillStyle = 'rgba(190,215,245,.6)';
    ctx.font = '700 11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
  }

  /* 安全出口牌：贴在走廊北墙上的小牌子，不占走廊地面 */
  function drawWallExit() {
    for (var i = 0; i < facs.length; i++) {
      var f = facs[i];
      if (f.t !== 'exit') { continue; }
      var r = f.p;
      ctx.fillStyle = 'rgba(32,120,80,.95)';
      ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
      ctx.strokeStyle = 'rgba(216,255,233,.5)';
      ctx.lineWidth = 1;
      ctx.strokeRect(r.x0 + 0.5, r.y0 + 0.5, r.x1 - r.x0 - 1, r.y1 - r.y0 - 1);
      ctx.fillStyle = '#d8ffe9';
      ctx.font = '700 9px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('出口', (r.x0 + r.x1) / 2, (r.y0 + r.y1) / 2 + 1);
    }
  }

  /* 厕所：能走进去的区域，没有出口，「厕所」两个字标在房间里（顶部走廊、右侧走廊各一处） */
  function drawWc() {
    for (var wi = 0; wi < wcRects.length; wi++) { drawOneWc(wcRects[wi]); }
  }

  function drawOneWc(r) {
    if (!r) { return; }
    var w = r.x1 - r.x0, h = r.y1 - r.y0;
    var cy = (r.y0 + r.y1) / 2;

    /* 房间轮廓 */
    ctx.strokeStyle = 'rgba(120,150,190,.4)';
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x0 + 3, r.y0 + 3, w - 6, h - 6);

    /* 两个隔间（靠里侧） */
    var sx = r.x0 + w * 0.46;
    ctx.strokeStyle = 'rgba(120,150,190,.4)';
    ctx.lineWidth = 1.5;
    for (var i = 1; i <= 2; i++) {
      var y = r.y0 + h * i / 3;
      ctx.beginPath();
      ctx.moveTo(r.x0 + 5, y);
      ctx.lineTo(sx, y);
      ctx.stroke();
    }
    /* 隔断竖线 */
    ctx.beginPath();
    ctx.moveTo(sx, r.y0 + 5);
    ctx.lineTo(sx, r.y1 - 5);
    ctx.stroke();

    /* 洗手台（靠走廊那侧） */
    ctx.fillStyle = '#1b2536';
    ctx.fillRect(sx + 8, r.y0 + 10, Math.max(10, r.x1 - sx - 18), h - 20);

    /* 「厕所」两个字：房间矮，招牌做小，正好卡在两个隔间之间 */
    var lbx = (r.x0 + 5 + sx) / 2;
    ctx.fillStyle = 'rgba(6,11,20,.88)';
    ctx.fillRect(lbx - 18, cy - 8, 36, 16);
    ctx.strokeStyle = 'rgba(120,190,255,.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(lbx - 18, cy - 8, 36, 16);
    ctx.fillStyle = '#dbeaff';
    ctx.font = '700 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('厕所', lbx, cy);
  }

  /* 房门：所有宿舍长得一模一样，不透露哪间有钥匙 */
  function drawDoor(rm) {
    if (!rm.door) { return; }
    var d = rm.door;

    ctx.strokeStyle = 'rgba(120,150,190,.75)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    if (d.side === 'T' || d.side === 'B') {
      ctx.moveTo(d.x - 10, d.y); ctx.lineTo(d.x + 10, d.y);
    } else {
      ctx.moveTo(d.x, d.y - 10); ctx.lineTo(d.x, d.y + 10);
    }
    ctx.stroke();
  }

  function drawFac(f) {
    var r = f.p, cx = f.cx, cy = f.cy;

    if (f.t === 'stairs') {
      ctx.fillStyle = '#182234';
      ctx.fillRect(r.x0 + 4, r.y0 + 4, r.x1 - r.x0 - 8, r.y1 - r.y0 - 8);
      ctx.strokeStyle = 'rgba(160,190,230,.5)';
      ctx.lineWidth = 1.5;
      for (var i = 0; i < 6; i++) {
        var yy = r.y0 + 8 + i * ((r.y1 - r.y0 - 16) / 6);
        ctx.beginPath();
        ctx.moveTo(r.x0 + 8, yy);
        ctx.lineTo(r.x1 - 8, yy);
        ctx.stroke();
      }
      label(cx, cy, '楼梯');
    } else if (f.t === 'elev') {
      ctx.fillStyle = '#202a3c';
      ctx.fillRect(r.x0 + 3, r.y0 + 3, r.x1 - r.x0 - 6, r.y1 - r.y0 - 6);
      ctx.strokeStyle = 'rgba(255,209,102,.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, r.y0 + 6); ctx.lineTo(cx, r.y1 - 6);
      ctx.stroke();
      label(cx, cy, '电梯');
    }
  }

  function label(x, y, text) {
    ctx.fillStyle = 'rgba(190,215,245,.8)';
    ctx.font = '700 10px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 18);
  }

  function drawPlayer() {
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fillStyle = player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0 ? '#ffb3b3' : '#cfe6ff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#4f9cf9';
    ctx.stroke();

    /* 朝向 */
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + player.fx * (player.r + 7), player.y + player.fy * (player.r + 7));
    ctx.strokeStyle = 'rgba(159,224,255,.9)';
    ctx.lineWidth = 2;
    ctx.stroke();

    if (player.stun > 0) {
      ctx.fillStyle = '#ffd166';
      ctx.font = '700 11px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('眩晕', player.x, player.y - 18);
    }
    if (player.shield > 0) {
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r + 6, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(120,220,255,.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  function drawSup(s) {
    /* 手电筒：按墙裁剪，不穿墙（不然躲在墙后也会看到光扫过来） */
    var RANGE = 250, HALF = 0.58;
    var g = ctx.createRadialGradient(s.x, s.y, 8, s.x, s.y, RANGE);
    g.addColorStop(0, 'rgba(255,238,170,.26)');
    g.addColorStop(0.7, 'rgba(255,232,150,.10)');
    g.addColorStop(1, 'rgba(255,232,150,0)');
    var N = 20, i, a, t, px, py;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    for (i = 0; i <= N; i++) {
      a = s.ang - HALF + (2 * HALF) * i / N;
      t = rayDist(s.x, s.y, Math.cos(a), Math.sin(a), RANGE);
      px = s.x + Math.cos(a) * t; py = s.y + Math.sin(a) * t;
      ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.mode === 'chase' ? '#ff5d5d' : '#c9534b';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,180,170,.9)';
    ctx.stroke();

    if (s.mode === 'chase') {
      ctx.fillStyle = '#ff5d5d';
      ctx.font = '700 14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('!', s.x, s.y - 20);
    }
  }

  function drawParts() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     23. 绘制：走廊
     ============================================================ */
  function drawCorridor() {
    var i, r;

    var shx = 0, shy = 0;
    if (shake > 0.3) {
      shx = (Math.random() - 0.5) * shake;
      shy = (Math.random() - 0.5) * shake;
    }
    camL = camX - W / 2 + shx;
    camT = camY - H / 2 + shy;
    camR = camL + W;
    camB = camT + H;

    ctx.setTransform(UNIT, 0, 0, UNIT, 0, 0);
    ctx.fillStyle = '#02040a';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(-camL, -camT);

    /* 宿舍方块 */
    for (i = 0; i < rooms.length; i++) {
      r = rooms[i].r;
      if (r.x1 < camL - 60 || r.x0 > camR + 60 || r.y1 < camT - 60 || r.y0 > camB + 60) { continue; }
      drawRoomBlock(rooms[i]);
    }

    /* 走廊地面 */
    for (i = 0; i < areas.length; i++) {
      r = areas[i].p;
      if (r.x1 < camL - 60 || r.x0 > camR + 60 || r.y1 < camT - 60 || r.y0 > camB + 60) { continue; }
      drawArea(areas[i]);
    }

    /* 实心墙体块：先把墙填上，墙体线再压在上面 */
    for (i = 0; i < wallFills.length; i++) {
      r = wallFills[i];
      if (r.x1 < camL - 60 || r.x0 > camR + 60 || r.y1 < camT - 60 || r.y0 > camB + 60) { continue; }
      ctx.fillStyle = WALL_FILL_COL;
      ctx.fillRect(r.x0, r.y0, r.x1 - r.x0, r.y1 - r.y0);
    }

    /* 墙体 */
    for (i = 0; i < areas.length; i++) {
      r = areas[i].p;
      if (r.x1 < camL - 60 || r.x0 > camR + 60 || r.y1 < camT - 60 || r.y0 > camB + 60) { continue; }
      drawWalls(areas[i]);
      drawDoorMarks(areas[i]);
    }

    /* 房门 */
    for (i = 0; i < rooms.length; i++) {
      r = rooms[i].r;
      if (r.x1 < camL - 60 || r.x0 > camR + 60 || r.y1 < camT - 60 || r.y0 > camB + 60) { continue; }
      drawDoor(rooms[i]);
    }

    /* 设施 */
    for (i = 0; i < facs.length; i++) {
      if (facs[i].custom) { continue; }       /* 电梯间 / 楼梯门自己画 */
      r = facs[i].p;
      if (r.x1 < camL - 60 || r.x0 > camR + 60 || r.y1 < camT - 60 || r.y0 > camB + 60) { continue; }
      drawFac(facs[i]);
    }

    /* 1008 下面：楼梯门（安全出口）在上、电梯间在下；1001 对面是厕所 */
    drawStairNiche();
    drawElevRoom();
    drawWc();
    drawWallExit();

    /* 地上的臭袜子 */
    for (i = 0; i < traps.length; i++) {
      if (traps[i].dead) { continue; }
      ctx.beginPath();
      ctx.arc(traps[i].x, traps[i].y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#3a3226';
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,120,80,.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    drawParts();
    for (i = 0; i < sups.length; i++) { drawSup(sups[i]); }
    drawPlayer();

    ctx.restore();

    /* 迷雾 */
    var psx = player.x - camL, psy = player.y - camT;
    fog(psx, psy, FOG_R);
    screenFX();
    drawPrompt(psx, psy);
  }

  function drawPrompt(psx, psy) {
    if (state !== 'playing' || !curTarget) { return; }
    ctx.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var w = ctx.measureText(curTarget.label).width + 20;
    ctx.fillStyle = 'rgba(8,14,24,.82)';
    ctx.fillRect(psx - w / 2, psy - 52, w, 22);
    ctx.fillStyle = '#ffd166';
    ctx.fillText(curTarget.label, psx, psy - 41);

    /* 读条：推门 0.5s、下楼梯 1s、电梯 3s、门禁 5s，统一用这一条小进度条 */
    var barP = -1;
    if (doorBusy) { barP = doorT / DOOR_TIME; }
    else if (holdT > 0 && holdId && curTarget) { barP = holdT / holdNeedOf(curTarget.type); }
    if (barP >= 0) {
      barP = clamp(barP, 0, 1);
      ctx.fillStyle = 'rgba(255,255,255,.2)';
      ctx.fillRect(psx - 24, psy - 22, 48, 4);
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(psx - 24, psy - 22, 48 * barP, 4);
    }
  }

  /* ============================================================
     24. 绘制：宿舍内部
     ============================================================ */
  function drawRoom() {
    var box = roomSc.box;
    ctx.setTransform(UNIT, 0, 0, UNIT, 0, 0);
    ctx.fillStyle = '#02040a';
    ctx.fillRect(0, 0, W, H);

    /* 房间地面（长方形六人寝） */
    ctx.fillStyle = '#0a1019';
    ctx.fillRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);

    ctx.save();
    ctx.beginPath();
    ctx.rect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);
    ctx.clip();
    ctx.strokeStyle = 'rgba(90,130,180,.08)';
    ctx.lineWidth = 1;
    for (var x = box.x0; x < box.x1; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, box.y0); ctx.lineTo(x, box.y1); ctx.stroke();
    }
    for (var y = box.y0; y < box.y1; y += 32) {
      ctx.beginPath(); ctx.moveTo(box.x0, y); ctx.lineTo(box.x1, y); ctx.stroke();
    }
    ctx.restore();

    /* 墙 */
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#1b2536';
    ctx.strokeRect(box.x0 + 4, box.y0 + 4, box.x1 - box.x0 - 8, box.y1 - box.y0 - 8);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = 'rgba(79,156,249,.18)';
    ctx.strokeRect(box.x0 + 4, box.y0 + 4, box.x1 - box.x0 - 8, box.y1 - box.y0 - 8);

    /* 家具：三张上下铺、并排四座长桌 + 另一边两座、门口六人柜 */
    drawBunks();
    drawDesks();
    drawCabinet();

    /* 门口 */
    ctx.strokeStyle = 'rgba(255,209,102,.8)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(ROOM_DOOR.x - 40, box.y1); ctx.lineTo(ROOM_DOOR.x + 40, box.y1);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,209,102,.55)';
    ctx.font = '700 11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('门', ROOM_DOOR.x, box.y1 - 16);

    /* 房间号 */
    ctx.fillStyle = 'rgba(120,150,190,.55)';
    ctx.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(roomLabel(roomSc.room), (box.x0 + box.x1) / 2, box.y0 + 26);

    /* 道具（臭袜子踩到就没了） */
    var it = roomSc.room.item;
    if (it && it !== 'none' && !roomSc.taken) {
      drawItemIcon(it, ROOM_ITEM.x, ROOM_ITEM.y);
    }

    /* 宿管的手电扫视（只有真在查寝时才会有） */
    if (roomSc.arrived) { drawBeam(); }

    drawParts();
    drawPlayer();

    fog(player.x, player.y, FOG_ROOM);
    screenFX();
    drawPrompt(player.x, player.y);

    if (roomSc.checking && !roomSc.arrived) {
      ctx.fillStyle = 'rgba(255,209,102,.75)';
      ctx.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('门外有脚步声', W / 2, H - 26);
    }
  }

  /* 三张竖放的上铺：床架 + 床垫 + 枕头 + 被子 + 靠房间内侧的梯子 */
  function drawBunks() {
    for (var i = 0; i < BUNK.length; i++) {
      var b = BUNK[i];
      var w = b.x1 - b.x0, h = b.y1 - b.y0;

      /* 床架 */
      ctx.fillStyle = '#16202e';
      ctx.fillRect(b.x0, b.y0, w, h);
      ctx.strokeStyle = 'rgba(120,150,190,.45)';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x0 + 1, b.y0 + 1, w - 2, h - 2);

      /* 上铺床垫 */
      ctx.fillStyle = 'rgba(79,156,249,.18)';
      ctx.fillRect(b.x0 + 6, b.y0 + 6, w - 12, h - 12);

      /* 枕头（靠床头一端） */
      ctx.fillStyle = 'rgba(196,220,248,.55)';
      ctx.fillRect(b.x0 + 10, b.y0 + 12, w - 20, 22);

      /* 被子 */
      ctx.fillStyle = 'rgba(79,156,249,.32)';
      ctx.fillRect(b.x0 + 10, b.y0 + 42, w - 20, h - 54);

      /* 梯子：放在朝房间中央的一侧 */
      var ladX = (b.x0 > 450) ? b.x0 + 3 : b.x1 - 3;
      ctx.strokeStyle = 'rgba(160,190,230,.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ladX, b.y0 + 14);
      ctx.lineTo(ladX, b.y1 - 14);
      ctx.stroke();
      for (var r = 0; r < 5; r++) {
        var ly = b.y0 + 18 + r * ((h - 36) / 5);
        ctx.beginPath();
        ctx.moveTo(ladX - 5, ly);
        ctx.lineTo(ladX + 5, ly);
        ctx.stroke();
      }
    }
  }

  /* 桌子：靠左墙的并排四座长桌 + 另一边靠右墙的两座 */
  function drawDesks() {
    drawDesk(DESK4, 4, 'R');
    drawDesk(DESK2, 2, 'L');
  }

  function drawDesk(d, count, seatSide) {
    var w = d.x1 - d.x0, h = d.y1 - d.y0;

    /* 桌面 */
    ctx.fillStyle = '#1c2736';
    ctx.fillRect(d.x0, d.y0, w, h);
    ctx.strokeStyle = 'rgba(150,180,220,.45)';
    ctx.lineWidth = 2;
    ctx.strokeRect(d.x0 + 1, d.y0 + 1, w - 2, h - 2);
    /* 桌面高光 */
    ctx.fillStyle = 'rgba(255,209,102,.10)';
    ctx.fillRect(d.x0 + 5, d.y0 + 5, w - 10, 5);

    /* 座位 */
    var horiz = w >= h;
    for (var i = 0; i < count; i++) {
      var cx, cy;
      if (horiz) {
        cx = d.x0 + w * (i + 0.5) / count;
        cy = (seatSide === 'B') ? d.y1 + 15 : d.y0 - 15;
      } else {
        cy = d.y0 + h * (i + 0.5) / count;
        cx = (seatSide === 'R') ? d.x1 + 15 : d.x0 - 15;
      }
      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#26344a';
      ctx.fill();
      ctx.strokeStyle = 'rgba(160,190,230,.45)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  /* 贴左墙的六人柜：2 列 × 3 行 = 6 格 */
  function drawCabinet() {
    var c = CABINET;
    var w = c.x1 - c.x0, h = c.y1 - c.y0;

    ctx.fillStyle = '#1a2434';
    ctx.fillRect(c.x0, c.y0, w, h);
    ctx.strokeStyle = 'rgba(150,180,220,.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(c.x0 + 1, c.y0 + 1, w - 2, h - 2);

    ctx.strokeStyle = 'rgba(150,180,220,.35)';
    ctx.lineWidth = 1;
    var cw = w / 2, ch = h / 3, i;
    for (i = 1; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(c.x0 + i * cw, c.y0 + 3);
      ctx.lineTo(c.x0 + i * cw, c.y1 - 3);
      ctx.stroke();
    }
    for (i = 1; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(c.x0 + 3, c.y0 + i * ch);
      ctx.lineTo(c.x1 - 3, c.y0 + i * ch);
      ctx.stroke();
    }

  }

  /* 手电扫视的角度（以门为圆心，向上扫 ±36°） */
  function beamAngle(t) {
    return -Math.PI / 2 + Math.sin(t * 2.0) * 0.62;
  }

  /* 玩家是否站在光柱里（半角 19.5°，贴着门两侧站就是安全的） */
  function inBeam(px, py, ang) {
    var dx = px - ROOM_DOOR.x, dy = py - ROOM_DOOR.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > 340 || d < 1) { return false; }
    var a = Math.atan2(dy, dx);
    var diff = Math.abs(((a - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
    return diff < 0.34;
  }

  function drawBeam() {
    var ang = beamAngle(roomSc.scanT);
    var g = ctx.createRadialGradient(ROOM_DOOR.x, ROOM_DOOR.y, 10,
                                     ROOM_DOOR.x, ROOM_DOOR.y, 340);
    g.addColorStop(0, 'rgba(255,238,170,.30)');
    g.addColorStop(0.75, 'rgba(255,232,150,.13)');
    g.addColorStop(1, 'rgba(255,232,150,0)');
    ctx.beginPath();
    ctx.moveTo(ROOM_DOOR.x, ROOM_DOOR.y);
    ctx.arc(ROOM_DOOR.x, ROOM_DOOR.y, 340, ang - 0.34, ang + 0.34);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
  }

  function drawItemIcon(t, x, y) {
    if (t === 'key') {
      var g = ctx.createRadialGradient(x, y, 0, x, y, 40);
      g.addColorStop(0, 'rgba(255,209,102,.5)');
      g.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, 40, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x - 10, y, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 2, y); ctx.lineTo(x + 16, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 10, y); ctx.lineTo(x + 10, y + 7); ctx.stroke();
    } else if (t === 'laptop') {
      ctx.fillStyle = '#3d4a60';
      ctx.fillRect(x - 18, y - 12, 36, 22);
      ctx.fillStyle = '#9fe0ff';
      ctx.fillRect(x - 14, y - 8, 28, 14);
      ctx.fillStyle = '#2a3344';
      ctx.fillRect(x - 20, y + 10, 40, 4);
    } else if (t === 'basin') {
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#5a6f8f';
      ctx.fill();
      ctx.strokeStyle = '#cfe0f7';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(207,224,247,.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (t === 'sock') {
      ctx.fillStyle = '#3a3226';
      ctx.beginPath();
      ctx.ellipse(x, y, 12, 8, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,120,80,.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  /* ============================================================
     25. 绘制：一楼门禁
     ============================================================ */
  function drawLobby() {
    var box = lobbySc.box;
    ctx.setTransform(UNIT, 0, 0, UNIT, 0, 0);
    ctx.fillStyle = '#02040a';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#0b1220';
    ctx.fillRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);

    ctx.save();
    ctx.beginPath();
    ctx.rect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);
    ctx.clip();
    ctx.strokeStyle = 'rgba(90,130,180,.08)';
    ctx.lineWidth = 1;
    for (var x = box.x0; x < box.x1; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, box.y0); ctx.lineTo(x, box.y1); ctx.stroke();
    }
    for (var y = box.y0; y < box.y1; y += 32) {
      ctx.beginPath(); ctx.moveTo(box.x0, y); ctx.lineTo(box.x1, y); ctx.stroke();
    }
    ctx.restore();

    ctx.lineWidth = 8;
    ctx.strokeStyle = '#1b2536';
    ctx.strokeRect(box.x0 + 4, box.y0 + 4, box.x1 - box.x0 - 8, box.y1 - box.y0 - 8);

    /* 门禁 */
    ctx.fillStyle = 'rgba(32,120,80,.85)';
    ctx.fillRect(box.x0 + 4, box.y0 + 4, 170, 10);
    ctx.fillRect(box.x0 + 276, box.y0 + 4, 170, 10);
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(410, box.y0); ctx.lineTo(490, box.y0);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,209,102,.75)';
    ctx.font = '700 12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('门禁 · 长按 F', 450, box.y0 + 30);

    /* 楼梯口（走楼梯下来才有）：原路回走廊 */
    if (lobbySc.back) {
      var bk = LOBBY_BACK;
      ctx.fillStyle = '#182234';
      ctx.fillRect(bk.x - 44, box.y1 - 26, 88, 22);
      ctx.strokeStyle = 'rgba(160,190,230,.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(bk.x - 43, box.y1 - 25, 86, 20);
      for (var bi = 0; bi < 4; bi++) {
        var by = box.y1 - 23 + bi * 4.5;
        ctx.beginPath();
        ctx.moveTo(bk.x - 38, by);
        ctx.lineTo(bk.x + 38, by);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(200,222,248,.8)';
      ctx.font = '700 11px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('楼梯口 · F 回走廊', bk.x, box.y1 - 42);
    }

    drawGuardRoom();

    drawParts();
    drawPlayer();
    if (lobbySc.guard) { drawLobbyGuard(lobbySc.guard); }

    fog(player.x, player.y, lobbySc.viaStairs ? FOG_STAIR : FOG_ROOM);
    screenFX();
    drawPrompt(player.x, player.y);
  }

  /* 一楼门禁旁的值班室：宿管待在里面，随机出来 */
  function drawGuardRoom() {
    var g = LOBBY_GUARDROOM;
    var w = g.x1 - g.x0, h = g.y1 - g.y0;

    ctx.fillStyle = '#0a0f18';
    ctx.fillRect(g.x0, g.y0, w, h);
    ctx.strokeStyle = 'rgba(150,180,220,.55)';
    ctx.lineWidth = 2;
    ctx.strokeRect(g.x0 + 1, g.y0 + 1, w - 2, h - 2);

    /* 朝大厅那侧的门（右侧墙中间，宿管从这里进出） */
    ctx.strokeStyle = 'rgba(6,10,18,1)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(g.x1, (g.y0 + g.y1) / 2 - 18);
    ctx.lineTo(g.x1, (g.y0 + g.y1) / 2 + 18);
    ctx.stroke();

    ctx.fillStyle = 'rgba(190,215,245,.8)';
    ctx.font = '700 11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('值班室', (g.x0 + g.x1) / 2, g.y0 + 16);
  }

  function drawLobbyGuard(g) {
    /* 手电筒扇形：同样按墙裁剪 */
    var RANGE = 190, HALF = 0.55;
    var grad = ctx.createRadialGradient(g.x, g.y, 8, g.x, g.y, RANGE);
    grad.addColorStop(0, 'rgba(255,238,170,.26)');
    grad.addColorStop(0.7, 'rgba(255,232,150,.10)');
    grad.addColorStop(1, 'rgba(255,232,150,0)');
    var N = 20, i, a, t;
    ctx.beginPath();
    ctx.moveTo(g.x, g.y);
    for (i = 0; i <= N; i++) {
      a = g.ang - HALF + (2 * HALF) * i / N;
      t = rayDist(g.x, g.y, Math.cos(a), Math.sin(a), RANGE);
      ctx.lineTo(g.x + Math.cos(a) * t, g.y + Math.sin(a) * t);
    }
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
    ctx.fillStyle = g.mode === 'out' ? '#ff5d5d' : '#c9534b';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,180,170,.9)';
    ctx.stroke();

    if (g.mode === 'out') {
      ctx.fillStyle = '#ff5d5d';
      ctx.font = '700 14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('!', g.x, g.y - 20);
    }
  }

  /* ============================================================
     26. 主循环
     ============================================================ */
  function draw() {
    if (scene === 'room' && roomSc) { drawRoom(); return; }
    if (scene === 'lobby' && lobbySc) { drawLobby(); return; }
    drawCorridor();
  }

  function tick(ts) {
    var now = ts / 1000;
    if (!last) { last = now; }
    var dt = Math.min(0.05, Math.max(0, now - last));
    last = now;
    if (state === 'playing') { update(dt); }
    draw();
  }
  function loop(ts) { tick(ts); requestAnimationFrame(loop); }

  /* ============================================================
     27. 启动
     ============================================================ */
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('retryBtn').addEventListener('click', start);
  document.getElementById('winBtn').addEventListener('click', start);

  /* 拦截面板的返回按钮：放进站点 proF/ 后就能跳回主页 */
  document.getElementById('mobileBack').addEventListener('click', function () {
    location.href = '主页.html';
  });

  reset();                                  /* 先准备好世界，开场画面背后就是真实地图 */

  if (isTouchOnlyDevice()) {
    elIntro.classList.add('hidden');          /* 手机端只留拦截面板 */
    document.getElementById('mobile').classList.remove('hidden');
    /* 不启动主循环：这台设备只能看拦截面板 */
  } else {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
